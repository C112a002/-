<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<!--
  禁止被嵌入：這個編輯器只能直接開啟，不能被放進其他網站的 iframe / frame 裡。
  單一 HTML 檔沒辦法自己設定 HTTP 標頭，所以下面用 JavaScript 做檢查（只在 Claude、本機或原生 App 裡才允許被框起來）。
  如果你把這個檔案放在自己的伺服器上，建議再加上標頭：
    Content-Security-Policy: frame-ancestors 'none'      （舊瀏覽器再加 X-Frame-Options: DENY）
-->
<script>
(function () {
  var framed;
  try { framed = window.top !== window.self; } catch (e) { framed = true; }
  if (!framed) return;                                   // 沒有被嵌入：直接用
  var okHost = function (h) {
    return /(^|\.)(claude\.ai|claude\.com|claudeusercontent\.com|anthropic\.com)$/.test(h) || h === 'localhost' || h === '127.0.0.1' || h === '[::1]';
  };
  var origins = [];
  try { if (location.ancestorOrigins && location.ancestorOrigins.length) origins = Array.prototype.slice.call(location.ancestorOrigins); } catch (e) { /* 略過 */ }
  if (!origins.length) { try { if (document.referrer) origins = [new URL(document.referrer).origin]; } catch (e) { /* 略過 */ } }
  // 外面每一層網頁都檢查：不是 http(s)（file:、app:、null…）的視為本機或原生 App；Claude 自己的網域也允許
  var untrusted = origins.some(function (o) {
    if (!/^https?:\/\//i.test(o)) return false;
    try { return !okHost(new URL(o).hostname.toLowerCase()); } catch (e) { return false; }
  });
  if (!untrusted) return;
  var root = document.documentElement;
  var block = function () {
    window.__tmBlocked = true;
    root.className += ' tm-blocked';
    var st = document.createElement('style');
    st.textContent = '.tm-blocked body{display:none!important}';
    root.appendChild(st);
    var box = document.createElement('div');
    box.id = 'tm-block';
    box.style.cssText = 'position:fixed;inset:0;z-index:2147483647;display:grid;place-items:center;padding:24px;background:#f1f4f9;color:#1a2133;font:16px/1.6 system-ui,-apple-system,sans-serif;text-align:center';
    var inner = document.createElement('div');
    inner.style.maxWidth = '440px';
    inner.innerHTML = '<div style="font-size:44px">🐒</div><h1 style="font-size:20px;margin:8px 0">這個頁面不允許被嵌入<br>This page can\u2019t be embedded</h1>'
      + '<p>為了安全，這個編輯器只能直接開啟，不能放進其他網站的框架裡。<br>For safety, this editor can only be opened directly, not inside a frame on another site.</p>';
    if (/^https?:/i.test(location.href)) {
      var a = document.createElement('a');
      a.href = location.href; a.target = '_blank'; a.rel = 'noopener';
      a.textContent = '直接開啟 / Open it directly';
      a.style.cssText = 'display:inline-block;margin-top:8px;padding:8px 16px;border-radius:10px;background:#f6c026;color:#2b2200;font-weight:700;text-decoration:none';
      inner.appendChild(a);
    }
    box.appendChild(inner);
    root.appendChild(box);
    root.style.visibility = '';
  };
  // 在 Claude 的執行環境裡（頁面有 window.claude）也允許；等一下再判斷，沒有的話就擋下來
  window.__tmGate = new Promise(function (resolve) {
    root.style.visibility = 'hidden';
    var t0 = Date.now();
    (function poll() {
      if (window.claude) { root.style.visibility = ''; return resolve(true); }
      if (Date.now() - t0 > 2500) { block(); return resolve(false); }
      setTimeout(poll, 100);
    })();
  });
})();
</script>
<title>竄改猴積木編輯器</title>
<style>
:root{
  --ui:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Noto Sans Mono CJK TC","PingFang TC",monospace;
  --bg:#e8ecf3;--dot:#c3cbdf;--panel:#ffffff;--panel2:#f1f4f9;--ink:#1a2133;--muted:#657089;--line:#d4dae8;
  --accent:#f6c026;--accent-ink:#2b2200;--focus:#2f6bff;--danger:#d23a3a;--warn:#a4560a;--warn-bg:#fff1d9;--ok:#177a4a;
  --shadow:0 8px 28px rgba(22,32,64,.20);
  --code-bg:#f6f8fc;--code-ink:#25304a;--tk-com:#76829c;--tk-str:#0b7a4b;--tk-kw:#9b2bc9;--tk-num:#c2410c;--tk-meta:#2563eb;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151d;--dot:#252b3a;--panel:#1b2030;--panel2:#232a3d;--ink:#e6eaf5;--muted:#9aa4bd;--line:#303850;
    --focus:#6b9bff;--warn:#f0a95a;--warn-bg:#3a2a12;--ok:#5fd397;--shadow:0 8px 28px rgba(0,0,0,.55);
    --code-bg:#10131b;--code-ink:#d7def0;--tk-com:#7d89a6;--tk-str:#7fd6a5;--tk-kw:#d2a0ff;--tk-num:#ffb27a;--tk-meta:#8fb4ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d;--dot:#252b3a;--panel:#1b2030;--panel2:#232a3d;--ink:#e6eaf5;--muted:#9aa4bd;--line:#303850;
  --focus:#6b9bff;--warn:#f0a95a;--warn-bg:#3a2a12;--ok:#5fd397;--shadow:0 8px 28px rgba(0,0,0,.55);
  --code-bg:#10131b;--code-ink:#d7def0;--tk-com:#7d89a6;--tk-str:#7fd6a5;--tk-kw:#d2a0ff;--tk-num:#ffb27a;--tk-meta:#8fb4ff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* ---------- 頂列 ---------- */
#topbar{display:flex;align-items:center;gap:8px;padding:0 12px;height:52px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand .logo{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent);font-size:19px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.brand .ibtn{margin-left:-2px;font-size:19px}
:lang(zh-Hant) #btnExport{gap:0}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.top-actions .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.ibtn,.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 9px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.ibtn{font-size:18px}
.ibtn:hover,.tbtn:hover{background:var(--panel2)}
.ibtn[disabled]{opacity:.35;cursor:default;background:transparent}
.tbtn .ic{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.btn.primary:hover{filter:brightness(1.04);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.flat{border-color:transparent;background:transparent}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px;border-radius:8px}

/* ---------- 主版面 ---------- */
#main{display:grid;min-height:0;position:relative;
  grid-template-columns:76px 330px minmax(0,1fr);grid-template-areas:"cats pal ws";}
@media (min-width:1240px){#main{grid-template-columns:76px 330px minmax(0,1fr) 400px;grid-template-areas:"cats pal ws code"}}
#cats{grid-area:cats;display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border:0;background:transparent;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.cat .dot{width:22px;height:22px;border-radius:50%;background:var(--cc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.cat:hover{background:var(--panel2)}
.cat.on{background:var(--panel2);color:var(--ink)}
.cat.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--cc)}
.cat .cnt{position:absolute;top:4px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--cc);color:#fff;font-size:10px;line-height:16px;text-align:center}
#btnPalToggle{display:none}

#palette{grid-area:pal;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel2);border-right:1px solid var(--line);position:relative}
#palette.del-zone::after{content:"🗑 放開就刪除";position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--danger) 86%,transparent);color:#fff;font-weight:700;font-size:16px;z-index:5;pointer-events:none}
.pal-search{padding:10px 10px 6px}
.pal-search input{width:100%;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 11px}
#palList{flex:1;min-height:0;overflow:auto;padding:4px 14px 40px;font-size:14px;overscroll-behavior:contain;touch-action:pan-y;--hole:var(--panel2)}
.pal-title{font-weight:800;font-size:15px;margin:8px 0 2px}
.pal-tip{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.55}
.pal-item{margin:6px 0 12px;display:flex;align-items:flex-start;min-width:0}
.pal-item>.blk{max-width:100%}
.pal-item .blk{cursor:grab;touch-action:pan-y}
.pal-item .blk *{pointer-events:none}
.pal-sep{height:8px}
.pal-hint{display:flex;align-items:flex-start;gap:6px;margin:4px 0 8px;padding:7px 8px 7px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;line-height:1.5}
.pal-hint span{flex:1}
.pal-hint .btn{flex:none}
.pal-label{font-size:12px;color:var(--muted);margin:14px 0 4px;font-weight:700}
.pal-btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.var-row{display:flex;align-items:center;gap:6px;margin:6px 0 10px}
.var-row .pal-item{margin:0;flex:0 1 auto;min-width:0}
.var-row .btn{padding:2px 8px;min-height:26px;font-size:12px}
.pal-empty{color:var(--muted);padding:18px 4px;font-size:13px}

/* ---------- 工作區 ---------- */
#wsWrap{grid-area:ws;position:relative;min-width:0;min-height:0;overflow:hidden}
#ws{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain;cursor:default}
#ws.panning{cursor:grabbing}
#wsInner{position:relative;font-size:calc(14px * var(--z,1));--hole:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:calc(24px * var(--z,1)) calc(24px * var(--z,1));min-width:100%;min-height:100%}
.script{position:absolute;display:block}
.script.orphan{outline:2px dashed color-mix(in srgb,var(--warn) 70%,transparent);outline-offset:8px;border-radius:4px}
.orphan-tip{display:block;width:max-content;font-size:.82em;margin:0 0 .6em;color:var(--warn);background:var(--warn-bg);padding:1px 9px;border-radius:999px;font-weight:600;line-height:1.6}
#emptyHint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:20px}
#emptyHint .card{pointer-events:auto;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);text-align:center}
#emptyHint h3{margin:0 0 6px;font-size:18px}
#emptyHint p{margin:0 0 14px;color:var(--muted)}
#emptyHint .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#wsCtl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
#wsCtl .ibtn{background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(20,30,60,.12);width:38px;height:38px}
#wsCtl .ibtn[disabled]{opacity:.55}
#selBar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:6px;padding:6px 8px 6px 14px;max-width:calc(100% - 72px);background:var(--ink);color:var(--panel);border-radius:999px;box-shadow:var(--shadow)}
#selBar.show{display:flex}
#selBar .nm{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
#selBar button{border:0;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.16);color:inherit;white-space:nowrap;flex:none}
#selBar button.del{background:var(--danger);color:#fff}
#selBar button:hover{filter:brightness(1.12)}

/* ---------- 積木 ---------- */
.blk{--c:#888;--cd:#666;--cl:#aaa;position:relative;color:#fff;font-weight:600;line-height:1.25;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;text-shadow:0 1px 0 rgba(0,0,0,.14)}
.blk .row{display:flex;flex-wrap:wrap;align-items:center;gap:.28em .42em;min-width:0}
.blk .txt{white-space:pre-wrap;min-width:0}
.blk .keep{display:inline-flex;align-items:center;gap:.42em;flex-wrap:nowrap;max-width:100%}
.stk{display:flex;flex-direction:column;align-items:flex-start}
.blk.stack,.blk.hat,.blk.cap{display:flex;align-items:center;background:var(--c);border:1px solid var(--cd);border-radius:.4em;padding:.38em .8em;min-height:2.7em;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.blk.hat{border-radius:1.5em 1.5em .4em .4em / 1.15em 1.15em .4em .4em;padding-top:.8em;min-height:3.3em;margin-top:.3em}
.blk.stack::before,.blk.cap::before{content:"";position:absolute;left:1.05em;top:-1px;width:1.9em;height:.4em;background:rgba(0,0,0,.26);border-radius:0 0 .4em .4em}
.blk.stack::after,.blk.hat::after,.blk.c:not(.nobump)::after{content:"";position:absolute;left:1.05em;bottom:-.42em;width:1.9em;height:.42em;background:var(--c);border:1px solid var(--cd);border-top:0;border-radius:0 0 .4em .4em;z-index:2}
.blk.cap::after{display:none}
.blk.c{display:flex;flex-direction:column;background:var(--c);border:1px solid var(--cd);border-radius:.4em;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.blk.c::before{content:"";position:absolute;left:1.05em;top:-1px;width:1.9em;height:.4em;background:rgba(0,0,0,.26);border-radius:0 0 .4em .4em}
.blk.c>.row{padding:.38em .8em;min-height:2.7em}
.blk.c>.row.mid{padding-top:.3em;padding-bottom:.3em;min-height:2.2em}
.blk.c>.mouth{margin-left:1.15em;min-height:2.1em;padding:0 0 .45em 0;background:rgba(0,0,0,.2);box-shadow:inset 0 2px 3px rgba(0,0,0,.2);border-radius:.15em 0 0 .15em}
.blk.c>.mouth>.stk{min-height:1.6em}
.blk.c>.foot{height:1.25em}
.blk.reporter{display:inline-flex;align-items:center;vertical-align:middle;background:var(--c);border:1px solid var(--cd);border-radius:1.3em;padding:.14em .65em;min-height:1.95em;max-width:100%}
.blk.boolean{display:inline-flex;align-items:center;vertical-align:middle;position:relative;padding:.14em 1.1em;min-height:1.95em;max-width:100%}
.blk.boolean>.shape{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(1px 0 0 var(--cd)) drop-shadow(-1px 0 0 var(--cd)) drop-shadow(0 1px 0 var(--cd)) drop-shadow(0 -1px 0 var(--cd))}
.blk.boolean>.shape::before{content:"";position:absolute;inset:0;background:var(--c);clip-path:polygon(.95em 0,calc(100% - .95em) 0,100% 50%,calc(100% - .95em) 100%,.95em 100%,0 50%)}
.blk.boolean>.row{position:relative;z-index:1}
.blk.unknown{background:#777;padding:.4em .8em;border-radius:.4em;display:inline-block}
.blk.sel{outline:3px solid var(--focus);outline-offset:2px}
.slot{display:inline-flex;align-items:center;vertical-align:middle;max-width:100%}
.slot.bool.empty{position:relative;min-width:2.8em;min-height:1.95em}
.slot.bool.empty::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3);clip-path:polygon(.95em 0,calc(100% - .95em) 0,100% 50%,calc(100% - .95em) 100%,.95em 100%,0 50%)}
.slot.lit{background:#fff;color:#1b2233;text-shadow:none;border:1px solid rgba(0,0,0,.3);border-radius:.4em;min-height:1.8em;padding:0 .12em}
.slot.lit.num{border-radius:1em}
.slot.lit.nodrop{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.slot.lit:focus-within{box-shadow:0 0 0 2px var(--focus)}
.slot.hl{outline:3px solid #fff;box-shadow:0 0 0 6px var(--focus);border-radius:.5em}
.grow{display:inline-grid;align-items:center}
.grow::after{content:attr(data-v) " ";visibility:hidden;white-space:pre;grid-area:1/1;padding:.12em .35em;min-width:1.5em;font-weight:600;pointer-events:none}
.grow>input,.grow>textarea{grid-area:1/1;width:100%;min-width:0;font:inherit;font-weight:600;color:inherit;background:transparent;border:0;outline:0;padding:.12em .35em;margin:0;text-align:center;border-radius:inherit}
.grow.area::after{white-space:pre-wrap;word-break:break-all;min-width:13em;max-width:26em;font-family:var(--mono);font-weight:500;line-height:1.35}
.grow.area>textarea{text-align:left;font-family:var(--mono);font-weight:500;line-height:1.35;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.grow.sel::after,.grow.plain::after,.grow.text::after{min-width:3.2em}
.slot.clr{background:transparent;border:0;padding:0}
.slot.clr input{width:2.4em;height:1.7em;padding:0;border:2px solid #fff;border-radius:.4em;background:none;cursor:pointer}
.imgf{display:inline-flex;align-items:center;gap:.4em;vertical-align:middle;min-height:1.9em;padding:.1em .45em .1em .2em;background:#fff;color:#1b2233;text-shadow:none;border:1px solid rgba(0,0,0,.3);border-radius:.45em;cursor:pointer;font-weight:600}
.imgf img{width:1.8em;height:1.8em;object-fit:cover;border-radius:.3em;display:block}
.imgf .ico{display:grid;place-items:center;min-width:1.8em;height:1.8em;font-size:1.25em;line-height:1}
.imgf .cap{font-size:.78em;color:#667089}
.dd{display:inline-flex;align-items:center;gap:.3em;vertical-align:middle;min-height:1.8em;padding:.06em .55em;background:var(--cd);color:#fff;border-radius:.4em;cursor:pointer;white-space:pre;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.dd::after{content:"▾";font-size:.78em;opacity:.9}
.blk.boolean .dd,.blk.reporter .dd{background:rgba(0,0,0,.22)}
#ws .blk{cursor:grab}
body.dragging,body.dragging *{cursor:grabbing!important}
@media (pointer:coarse){.grow{font-size:max(16px,1em)}}

#dragLayer{position:fixed;inset:0;pointer-events:none;z-index:1500;overflow:hidden}
.ghost{position:absolute;left:0;top:0;opacity:.94;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));will-change:transform;--hole:var(--bg)}
.snap{position:absolute;height:7px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px var(--focus),0 0 12px var(--focus)}

/* ---------- 彈出選單 ---------- */
#popLayer{position:fixed;inset:0;z-index:3000;pointer-events:none}
#popLayer.on{pointer-events:auto}
.menu{position:fixed;min-width:130px;max-width:min(320px,92vw);max-height:min(52vh,420px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;font-size:14px;overscroll-behavior:contain}
.menu .mi{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:var(--panel2)}
.menu .mi.on{font-weight:800}
.menu .mi.on::after{content:"✓";margin-left:auto;padding-left:12px;color:var(--ok)}
.menu .mi.dim{color:var(--muted)}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu .mh{padding:6px 11px 2px;font-size:12px;color:var(--muted);font-weight:700}

/* ---------- 對話框 ---------- */
#modalRoot{position:fixed;inset:0;z-index:2000;pointer-events:none}
.ov{position:absolute;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;animation:fadein .14s ease-out}
.dlg{width:min(680px,100%);max-height:min(88vh,100%);display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.dlg.wide{width:min(860px,100%)}
.dlg.narrow{width:min(420px,100%)}
.dlg>header{display:flex;align-items:center;gap:8px;padding:14px 18px 10px}
.dlg>header h2{margin:0;font-size:17px;flex:1}
.dlg>.body{padding:6px 18px 14px;overflow:auto;overscroll-behavior:contain}
.dlg>footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.dlg p{margin:0 0 10px}
.dlg .muted,.muted{color:var(--muted)}
.field{display:grid;gap:5px;margin:0 0 14px}
.field>label,.field>.lb{font-weight:700;font-size:13px}
.field .hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.field input[type=text],.field input[type=search],.field textarea,.field select,.dlg textarea.code{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--panel2);color:var(--ink)}
.field textarea,.dlg textarea.code{font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical;min-height:90px;tab-size:2}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--focus)}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--focus)}
.callout{padding:10px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;line-height:1.6;margin:0 0 12px}
.callout.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
.callout.err{background:color-mix(in srgb,var(--danger) 12%,var(--panel));border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);white-space:pre-wrap}
.callout.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--accent)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.item .t{font-weight:700}
.item .d{font-size:12.5px;color:var(--muted)}
.item>div:first-child{flex:1;min-width:0}
.steps{counter-reset:s;list-style:none;margin:0 0 8px;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800}
.icon-row{display:flex;gap:8px;align-items:center}
.icon-row input[type=text]{flex:1;min-width:0}
.icon-prev{flex:none;width:44px;height:44px;border-radius:12px;border:1px solid var(--line);display:grid;place-items:center;font-size:26px;background:var(--panel2);overflow:hidden;line-height:1}
.icon-prev img{width:100%;height:100%;object-fit:cover;display:block}
kbd{font:600 12px var(--mono);padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
code.i{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- 程式碼面板 ---------- */
#codePane{grid-area:code;display:none;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
@media (min-width:1240px){#codePane{display:flex}#btnCodeClose{display:none}#btnExport{display:none}}
#codePane.open{display:flex}
.cp-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.cp-head b{font-size:15px;flex:1}
.cp-opts{display:flex;flex-wrap:wrap;gap:4px 16px;padding:2px 14px 8px;font-size:13px}
.cp-opts .chk{font-weight:500}
#cpWarn{padding:0 12px}
#cpWarn .callout{margin:0 0 8px;font-size:12.5px;padding:7px 10px}
#cpWarn ul{margin:2px 0 0;padding-left:18px}
.cp-code{flex:1;min-height:0;margin:0 12px;padding:12px 14px;overflow:auto;background:var(--code-bg);color:var(--code-ink);border:1px solid var(--line);border-radius:12px;font:12.5px/1.6 var(--mono);white-space:pre;tab-size:2;-webkit-user-select:text;user-select:text}
.cp-code .com{color:var(--tk-com)}.cp-code .str{color:var(--tk-str)}.cp-code .kw{color:var(--tk-kw)}.cp-code .num{color:var(--tk-num)}.cp-code .meta{color:var(--tk-meta);font-weight:700}
.cp-foot{display:flex;flex-wrap:wrap;gap:8px;padding:10px 12px 12px}
.cp-foot .btn.primary{flex:1}
@media (min-width:760px) and (max-width:1239px){
  #codePane{position:absolute;right:0;top:0;bottom:0;width:min(460px,92%);z-index:20;box-shadow:var(--shadow)}
}

/* ---------- 測試 ---------- */
.tframe{display:block;width:100%;height:210px;border:1px solid var(--line);border-radius:12px;background:#fff;margin:0 0 10px}
.tlog{min-height:44px;max-height:180px;overflow:auto;padding:8px 10px;border:1px solid var(--line);border-radius:12px;background:var(--code-bg);color:var(--code-ink);font:12.5px/1.6 var(--mono);white-space:pre-wrap;word-break:break-word}
.tlog .ln.error{color:var(--danger)}.tlog .ln.warn{color:var(--warn)}.tlog .ln.gm{color:var(--tk-meta)}.tlog .ln.sys{color:var(--ok);font-weight:700}
@media (max-width:1100px){#btnTest .lbl{display:none}}
@media (max-width:759px){#btnTest{display:none}}

/* ---------- 收藏、工作區搜尋 ---------- */
.pal-item .fav-btn{flex:none;margin:2px 0 0 4px;width:30px;height:30px;border:0;border-radius:8px;background:transparent;color:var(--muted);font-size:18px;line-height:1;cursor:pointer}
.pal-item .fav-btn:hover{background:var(--panel)}
.pal-item .fav-btn.on{color:#e0a800}
#wsFind{position:absolute;left:50%;top:10px;transform:translateX(-50%);z-index:7;display:flex;align-items:center;gap:2px;width:min(460px,calc(100% - 24px));padding:4px 4px 4px 14px;background:var(--panel);border:1px solid var(--line);border-radius:999px;box-shadow:var(--shadow)}
#wsFind[hidden]{display:none}
#wsFind input{flex:1;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font:inherit;padding:6px 4px}
#wsFind .cnt{flex:none;min-width:46px;padding-right:4px;text-align:right;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
#wsFind .ibtn{flex:none;width:32px;height:32px;min-width:32px;padding:0}
.blk.found{outline:3px solid #ffc800;outline-offset:2px}
.blk.found-cur{outline:4px solid #ff6a00;outline-offset:2px;box-shadow:0 0 0 7px rgba(255,106,0,.28)}
@media (max-width:759px){#wsFind input{font-size:16px}}

/* ---------- 提示 ---------- */
#toastRoot{position:fixed;left:0;right:0;top:calc(62px + env(safe-area-inset-top,0px));display:flex;flex-direction:column;align-items:center;gap:8px;z-index:4000;pointer-events:none}
.toast{max-width:min(92vw,520px);padding:9px 16px;border-radius:999px;background:var(--ink);color:var(--panel);box-shadow:var(--shadow);font-weight:600;font-size:13.5px;animation:fadein .15s ease-out}

/* ---------- 手機版 ---------- */
@media (max-width:759px){
  #topbar{padding:0 6px;gap:2px}
  .brand{gap:2px}
  .brand .logo{width:30px;height:30px;font-size:18px}
  .ibtn,.tbtn{min-width:34px;height:34px;padding:0 6px}
  .brand .ibtn{margin-left:0}
  #btnExport{padding:6px 11px;margin-left:2px}
  .brand small,.tbtn .lbl{display:none}
  .brand span.nm{display:none}
  .tbtn{padding:0 8px}
  .top-actions .sep{display:none}
  #main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto;grid-template-areas:"ws" "cats" "pal"}
  #cats{flex-direction:row;overflow-x:auto;overflow-y:hidden;padding:4px 6px;border-right:0;border-top:1px solid var(--line);gap:2px;scrollbar-width:none}
  #cats::-webkit-scrollbar{display:none}
  .cat{flex-direction:row;gap:6px;padding:7px 11px;border-radius:999px;flex:0 0 auto;font-size:13px}
  .cat .dot{width:14px;height:14px}
  .cat.on::before{display:none}
  .cat.on{background:var(--cc);color:#fff}
  .cat.on .dot{background:#fff}
  .cat .cnt{display:none}
  #btnPalToggle{display:inline-flex;flex:0 0 auto;margin-left:auto;position:sticky;right:0;background:var(--panel)}
  #palette{height:min(44vh,360px);border-right:0;border-top:1px solid var(--line)}
  .pal-search{padding:8px 10px 4px}
  .pal-search input{padding:5px 11px}
  .pal-title{display:none}
  .pal-tip{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;margin:4px 0 8px;font-size:12px;cursor:pointer}
  .pal-tip.open{-webkit-line-clamp:unset;display:block}
  #btnExport .lbl2{display:none}
  #main.pal-off #palette{display:none}
  #palList{padding:2px 12px 30px}
  #wsCtl{flex-direction:row;right:8px;bottom:8px}
  #wsCtl .ibtn{width:34px;height:34px}
  #selBar{bottom:56px;max-width:calc(100% - 20px)}
  #codePane{position:fixed;inset:0;z-index:1800;border-left:0;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
  .ov{align-items:flex-end;padding:0}
  .dlg,.dlg.wide,.dlg.narrow{width:100%;max-height:92vh;border-radius:18px 18px 0 0}
  .field-row{grid-template-columns:1fr}
  .field input[type=text],.field input[type=search],.field textarea,.pal-search input{font-size:16px}
  .menu{max-height:60vh}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

<body>
<div id="app">
  <header id="topbar">
    <div class="brand"><span class="logo" aria-hidden="true">🐒</span><button class="ibtn" id="btnLang" title="語言 / Language" aria-label="語言 / Language">🌐</button><span class="nm">竄改猴積木</span><small>用拖拉積木做出 Tampermonkey 腳本</small></div>
    <div class="top-actions">
      <button class="ibtn" id="btnUndo" title="復原 (Ctrl+Z)" aria-label="復原">↶</button>

      <button class="tbtn" id="btnExt" aria-label="自訂積木" title="匯入 JavaScript 自訂積木"><span class="ic">🧩</span><span class="lbl">自訂積木</span></button>

      <button class="tbtn" id="btnProject" aria-label="專案" title="專案"><span class="ic">📁</span><span class="lbl">專案</span></button>
      <button class="btn primary" id="btnExport"><span>匯出</span><span class="lbl2">腳本</span></button>
    </div>
  </header>
  <main id="main">
    <nav id="cats" aria-label="積木分類"></nav>
    <aside id="palette" aria-label="積木庫">

      <div id="palList"></div>

    <section id="wsWrap" aria-label="工作區">

        <input type="search" id="findInput" placeholder="在工作區找積木（文字、網址、選擇器…）" aria-label="搜尋工作區" autocomplete="off" spellcheck="false">
        <span id="findCount" class="cnt" aria-live="polite"></span>

      </div>
      <div id="emptyHint"><div class="card">
        <h3>從一個事件積木開始 🐒</h3>
        <p>每段程式都從一個「事件」積木開始，例如「當腳本啟動時」，再把其他積木接在它下面。</p>
        <div class="row"><button class="btn primary" id="hintStart">放一個「當腳本啟動時」</button><button class="btn" id="hintExamples">看範例</button></div>

<script>
'use strict';
/* =====================================================================
   竄改猴積木編輯器 — 純前端、單一檔案
   結構：工具 → 積木定義 → 資料模型 → 程式碼產生 → 擴充匯入 → 編輯器 → 介面 → 初始化
   ===================================================================== */

/* ---------- 小工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const q = JSON.stringify;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'text') el.textContent = tr(String(v));
      else if (k === 'title' || k === 'aria-label' || k === 'placeholder') el.setAttribute(k, tr(String(v)));
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(typeof kid === 'string' ? tr(kid) : String(kid)));
  }
  return el;
}

function debounce(fn, ms) {
  let t;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  d.flush = (...a) => { clearTimeout(t); fn(...a); };
  return d;
}

function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

function hexToRgb(hex) {
  const m = /^#?([\da-f]{3}|[\da-f]{6})$/i.exec(hex || '');
  if (!m) return [136, 136, 136];
  let s = m[1];
  if (s.length === 3) s = s.split('').map((c) => c + c).join('');
  const n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
/** amt < 0 變暗、amt > 0 變亮（-1 ~ 1） */
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return rgbToHex(r + (t - r) * p, g + (t - g) * p, b + (t - b) * p);
}

function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function fileSafeName(name, fallback = 'script') {
  const s = String(name || '').trim().replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '_').replace(/\s+/g, '-');
  return s || fallback;
}

/* ---------- 複製與下載 ---------- */
async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* 改用備用方式 */ }
  try {
    const ta = h('textarea', { style: { position: 'fixed', left: '-9999px', top: '0', opacity: '0' } });
    ta.value = text;
    document.body.append(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return !!ok;
  } catch (e) { return false; }
}

let _downloadsCap;
async function getDownloadsCap() {
  if (_downloadsCap !== undefined) return _downloadsCap;
  _downloadsCap = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') _downloadsCap = (await window.claude.use('downloads')) || null;
  } catch (e) { _downloadsCap = null; }
  return _downloadsCap;
}
/** 回傳 {ok, name, renamed, declined} */
async function saveFile(filename, text, mime) {
  const cap = await getDownloadsCap();
  if (cap) {
    // 檢視器只接受特定副檔名（.js 不在名單內），所以腳本檔會多加 .txt
    let name = filename;
    if (/\.js$/i.test(name)) name += '.txt';
    try {
      await cap.save({ filename: name, data: text });
      return { ok: true, name, renamed: name !== filename };
    } catch (e) {
      if (e && e.code === 'declined') return { ok: false, declined: true };
    }
  }
  try {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    return { ok: true, name: filename };
  } catch (e) { return { ok: false, error: e }; }
}
function readFileText(file) {
  if (file.text) return file.text();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(file); });
}

function notify(msg, ms = 2600) {
  const root = $('#toastRoot');
  while (root.children.length >= 2) root.firstChild.remove();   // 最多同時顯示 2 則
  const t = h('div', { class: 'toast', role: 'status', text: msg });

}

let _menu = null;
function closeMenu() {
  if (!_menu) return;
  const layer = $('#popLayer');
  layer.classList.remove('on'); layer.textContent = '';
  window.removeEventListener('keydown', _menu.onKey, true);
  _menu = null;
}
/** items: {label,value,on,dim,sep,header,onPick} */
function openMenu(anchor, items, opt = {}) {
  closeMenu();
  const layer = $('#popLayer');
  const menu = h('div', { class: 'menu', role: 'menu' });
  items.forEach((it) => {
    if (it.sep) { menu.append(h('div', { class: 'sep' })); return; }
    if (it.header) { menu.append(h('div', { class: 'mh', text: it.header })); return; }
    const mi = h('div', { class: 'mi' + (it.on ? ' on' : '') + (it.dim ? ' dim' : ''), role: 'menuitem' });
    mi.textContent = it.raw ? it.label : tr(it.label);   // raw：使用者自己的內容（變數名稱等），不翻譯
    mi.addEventListener('click', (e) => { e.stopPropagation(); closeMenu(); if (it.onPick) it.onPick(it.value); });
    menu.append(mi);
  });
  layer.append(menu);
  layer.classList.add('on');
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : { left: anchor.x, right: anchor.x, top: anchor.y, bottom: anchor.y };
  const vw = window.innerWidth, vh = window.innerHeight;
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = opt.alignRight ? r.right - mw : r.left;
  left = clamp(left, 8, Math.max(8, vw - mw - 8));
  let top = r.bottom + 4;
  if (top + mh > vh - 8) top = Math.max(8, r.top - mh - 4);
  if (top + mh > vh - 8) top = Math.max(8, vh - mh - 8);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  const on = menu.querySelector('.mi.on');
  if (on) menu.scrollTop = Math.max(0, on.offsetTop - menu.clientHeight / 2);
  layer.onpointerdown = (e) => { if (e.target === layer) closeMenu(); };
  layer.oncontextmenu = (e) => { e.preventDefault(); closeMenu(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); closeMenu(); } };
  window.addEventListener('keydown', onKey, true);
  _menu = { onKey };
}

const _modals = [];
function openModal({ title, body, footer, cls = '', onClose, dismissible = true }) {
  const ov = h('div', { class: 'ov' });
  const dlg = h('div', { class: 'dlg ' + cls, role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  let closed = false;
  const api = {
    el: dlg,
    close(v) {
      if (closed) return;
      closed = true;
      ov.remove();
      const i = _modals.indexOf(api);
      if (i >= 0) _modals.splice(i, 1);
      if (onClose) onClose(v);
    },
    dismissible,
  };
  dlg.append(h('header', null, h('h2', { text: title }), h('button', { class: 'ibtn', 'aria-label': '關閉', text: '✕', onclick: () => api.close() })));
  const bodyEl = h('div', { class: 'body' });
  (Array.isArray(body) ? body : [body]).forEach((n) => n && bodyEl.append(n));
  dlg.append(bodyEl);
  api.body = bodyEl;
  if (footer && footer.length) dlg.append(h('footer', null, ...footer));
  ov.append(dlg);
  ov.addEventListener('pointerdown', (e) => { if (e.target === ov && dismissible) api.close(); });
  $('#modalRoot').append(ov);
  _modals.push(api);
  return api;
}
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && _modals.length && !_menu) {
    const m = _modals[_modals.length - 1];
    if (m.dismissible) { e.preventDefault(); m.close(); }
  }
});

function uiPrompt({ title, label, value = '', placeholder = '', okText = '確定', hint = '' }) {
  return new Promise((resolve) => {
    const input = h('input', { type: 'text', value, placeholder, autocomplete: 'off', spellcheck: 'false' });
    let result = null;
    const ok = h('button', { class: 'btn primary', text: okText });
    const cancel = h('button', { class: 'btn', text: '取消' });
    const m = openModal({
      title, cls: 'narrow',
      body: h('div', { class: 'field' }, label ? h('label', { text: label }) : null, input, hint ? h('div', { class: 'hint', text: hint }) : null),
      footer: [cancel, ok],
      onClose: () => resolve(result),
    });
    const submit = () => { result = input.value; m.close(); };
    ok.onclick = submit;
    cancel.onclick = () => m.close();
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } });
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}
function uiConfirm({ title = '請確認', message, okText = '確定', danger = false }) {
  return new Promise((resolve) => {
    let result = false;
    const ok = h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), text: okText });
    const cancel = h('button', { class: 'btn', text: '取消' });
    const m = openModal({ title, cls: 'narrow', body: h('p', { text: message }), footer: [cancel, ok], onClose: () => resolve(result) });
    ok.onclick = () => { result = true; m.close(); };
    cancel.onclick = () => m.close();
    setTimeout(() => ok.focus(), 30);
  });
}

'use strict';
/* =====================================================================
   多語系：介面文字（程式碼除外）會自動翻成使用者的語言
   ‧ 原文是繁體中文；英文已內建（馬上就有，不需要網路）
   ‧ 目前支援：繁體中文、English。之後要加語言，只要在 I18N.bundled 加一份翻譯表、
     再把語言放進 LANGS 就好（翻譯表的鍵是中文原文，值是譯文，{0}、{NAME} 這類佔位符要原樣保留）
   ===================================================================== */
const I18N = {
  lang: 'zh-Hant',        // 目前的介面語言
  mode: 'auto',           // 'auto'（跟著瀏覽器）或使用者自己選的語言代碼
  dict: null,             // 目前語言的翻譯表（原文 → 譯文）；繁體中文時是 null
  bundled: {},            // 內建的翻譯表：{ en: {...} }
};
const LANGS = [
  { code: 'zh-Hant', name: '繁體中文' },
  { code: 'en', name: 'English' },
];
const CJK_RE = /[\u3000-\u303f\u3400-\u9fff\uff00-\uffef]/;

/** 翻譯一個字串；沒有譯文就原樣回傳（前後的空白會保留） */
function tr(s) {
  const d = I18N.dict;
  if (!d || typeof s !== 'string' || s === '') return s;
  const hit = d[s];
  if (hit !== undefined) return hit;
  const t = s.trim();
  if (t && t !== s) {
    const h2 = d[t];
    if (h2 !== undefined) { const i = s.indexOf(t); return s.slice(0, i) + h2 + s.slice(i + t.length); }
  }
  return s;
}
/** 帶參數的翻譯：原文裡用 {0}、{1}… 表示要填入的值 */
function trf(template, ...args) {
  return tr(template).replace(/\{(\d+)\}/g, (m, i) => (args[Number(i)] !== undefined ? String(args[Number(i)]) : m));
}

/* ---------- 偵測語言：中文系 → 繁體中文；其他語言 → English ---------- */
function detectLang() {
  const list = (navigator.languages && navigator.languages.length) ? navigator.languages : [navigator.language || 'zh-TW'];
  for (const raw of list) {
    const l = String(raw).toLowerCase();
    if (l === 'zh' || l.startsWith('zh-')) return 'zh-Hant';
    if (l === 'en' || l.startsWith('en-')) return 'en';
  }
  return list.length ? 'en' : 'zh-Hant';
}

/* ---------- 套用語言 ---------- */
const i18nListeners = [];
function onI18nChange(fn) { i18nListeners.push(fn); }
function applyLang(code) {
  I18N.lang = code;
  I18N.dict = I18N.bundled[code] || null;
  document.documentElement.lang = code;
}
function savedLang() { const v = storeGet('tmblocks.lang'); return v === 'zh-Hant' || v === 'en' ? v : 'auto'; }
/** 啟動時決定語言 */
function initLang() {
  const saved = savedLang();
  I18N.mode = saved;
  applyLang(saved === 'auto' ? detectLang() : saved);
}
/** 使用者選語言（code 可以是 'auto'） */
function chooseLang(code) {
  I18N.mode = code;
  storeSet('tmblocks.lang', code);
  applyLang(code === 'auto' ? detectLang() : code);
  i18nListeners.forEach((fn) => fn());
}

/* ---------- 網頁上原本就有的文字（靜態標籤）也一起翻 ---------- */
const _staticText = new Map();   // 文字節點 → 原文
const _staticAttr = [];          // [元素, 屬性, 原文]
let _staticTitle = '';
function collectStatic() {
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  let n;
  while ((n = walker.nextNode())) {
    const p = n.parentElement;
    if (!p || /^(SCRIPT|STYLE)$/.test(p.tagName)) continue;
    if (CJK_RE.test(n.nodeValue)) _staticText.set(n, n.nodeValue);
  }
  $$('[title],[aria-label],[placeholder]').forEach((el) => {
    ['title', 'aria-label', 'placeholder'].forEach((a) => { const v = el.getAttribute(a); if (v && CJK_RE.test(v)) _staticAttr.push([el, a, v]); });
  });
  _staticTitle = document.title;
}
function translateStatic() {
  _staticText.forEach((orig, node) => { node.nodeValue = tr(orig); });
  _staticAttr.forEach(([el, a, orig]) => el.setAttribute(a, tr(orig)));
  if (_staticTitle) document.title = tr(_staticTitle);
}

"等待、重複、判斷。像是「如果…那麼…」或「重複 10 次」。全自動腳本常用：等元素或文字出現、隨機等待（像真人一樣）、出錯時換個做法。": "Waiting, repeating and deciding, like \"if … then …\" or \"repeat 10 times\". Handy for fully automatic scripts: wait for an element or text, wait a random time (like a real person), and do something else when an error happens.",
"替你操作網頁：點擊按鈕、輸入文字、捲動、換頁。「元素選擇器」就是告訴積木要操作哪個東西，例如 #id、.class。不知道怎麼寫？到「進階」拿「元素選擇器工具」，點一下網頁上的元素就能複製。": "Operate the page for you: click buttons, type text, scroll, change pages. An \"element selector\" tells a block which thing to operate, such as #id or .class. Don't know how to write one? Get the \"Element picker tool\" from \"Advanced\" and click an element on the page to copy it.",
"模擬按鍵、輸入文字、滑鼠移動與點擊。注意：模擬出來的事件只有「網頁自己有在聽」的功能才會反應（例如快速鍵、選單、遊戲按鍵）；單純要把文字填進輸入框，用「動作 → 輸入文字」最穩。": "Simulate keys, typing, and mouse movement and clicks. Note: simulated events only affect features that the page itself is listening for (such as shortcuts, menus and game keys). To simply fill text into an input, \"Actions → Type text\" is the most reliable.",
"在畫面上放文字按鈕，按下去就執行積木；也能隨時改它的文字、顏色、大小、形狀和位置，或把它放進網頁的某個地方。每個按鈕有一個「名稱」，用名稱找到要調整的按鈕（用「放一個文字按鈕」做出來的按鈕，名稱就是它一開始的文字）。": "Put text buttons on the screen; pressing one runs your blocks. You can change a button's text, color, size, shape and position at any time, or place it somewhere inside the page. Every button has a \"name\", and you use the name to pick the button to adjust (for a button made with \"Put a text button\", the name is its original text).",
"在畫面上放一個圖片按鈕（可以用你自己的圖片）；也能用「文字」或「圖片」找到網頁上的按鈕再點下去，或替換、插入圖片。": "Put an image button on the screen (you can use your own picture). You can also find buttons on the page by their text or image and click them, or replace and insert images.",
"改變網頁的樣子：隱藏廣告、換顏色、改文字、加入新內容。「嵌入網頁」可以把另一個網頁（或你自己寫的 HTML）放進目前的網頁，或做成浮動視窗、彈出視窗。有些網站禁止被嵌入，會顯示空白，這是對方網站的限制。": "Change how the page looks: hide ads, change colors, edit text, add new content. \"Embed web page\" puts another web page (or HTML you write yourself) into the current page, or shows it as a floating window or popup. Some sites forbid being embedded and show up blank; that's a restriction of that site.",
"跟使用者說話：彈出視窗、浮動提示、桌面通知。": "Talk to the user: popup windows, floating notices, desktop notifications.",
"讀取網頁資訊：目前網址、元素的文字、頁面上有沒有某個東西。這些圓形積木可以放進其他積木的空格。": "Read information from the page: the current URL, the text of an element, whether something is on the page. These round blocks can be dropped into the slots of other blocks.",
"加減乘除、比較大小、處理文字。圓形和六角形的積木可以拖進其他積木的空格裡。": "Add, subtract, multiply, divide, compare numbers and work with text. Round and hexagonal blocks can be dragged into the slots of other blocks.",
"變數像是會記住東西的盒子，例如「分數」。清單可以放很多項目。": "A variable is like a box that remembers something, such as \"score\". A list can hold many items.",
"把一組積木包成一個函式，之後用「執行函式」重複使用。": "Wrap a group of blocks into a function, then reuse it with \"Run function\".",
"連到網路抓資料，或把資料永久存在瀏覽器（關掉網頁也還在）。": "Fetch data from the internet, or save data permanently in the browser (it stays even after you close the page).",
"註解、元素選擇器工具，以及直接寫 JavaScript 的積木。": "Comments, the element picker tool, and blocks for writing JavaScript directly.",

const hiddenRules = {};
function hide(target) {
  if (typeof target === 'string') {
    if (!hiddenRules[target]) hiddenRules[target] = addCSS(target + ' { display: none !important; }');

    els(target).forEach((el) => el.style.setProperty('display', 'none', 'important'));

// 元素出現時（包含之後才動態出現的）執行一次
function onAppear(selector, callback) {
  const seen = new WeakSet();
  let timer = null;
  const scan = () => {
    timer = null;
    els(selector).forEach((el) => {
      if (seen.has(el)) return;
      seen.add(el);
      callback(el);
    });
  };
  scan();
  new MutationObserver(() => { if (!timer) timer = setTimeout(scan, 100); })
    .observe(document.documentElement, { childList: true, subtree: true });
}`);

helper('waitFor', ['el1'], String.raw`
// 等到元素出現（最多等 timeout 秒），回傳該元素，逾時回傳 null
function waitFor(selector, timeout = 10) {
  return new Promise((resolve) => {
    const found = el1(selector);
    if (found) return resolve(found);
    const timer = setTimeout(() => { observer.disconnect(); resolve(null); }, timeout * 1000);
    const observer = new MutationObserver(() => {
      const el = el1(selector);
      if (el) { clearTimeout(timer); observer.disconnect(); resolve(el); }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
  });
}`);

// 偵測網址變化（單頁式網站換頁時網址會變，但頁面不會重新載入）
function onUrlChange(callback) {
  let last = location.href;
  const check = () => {
    if (location.href === last) return;
    last = location.href;
    callback(last);
  };
  ['pushState', 'replaceState'].forEach((name) => {
    const original = history[name];
    history[name] = function () {
      const result = original.apply(this, arguments);
      setTimeout(check, 0);
      return result;
    };
  });
  window.addEventListener('popstate', check);
  window.addEventListener('hashchange', check);
  setInterval(check, 800);
}`);

// 把頁面上所有的文字 from 換成 to（只改文字，不動網頁結構）
function replaceText(from, to) {
  from = String(from); to = String(to);
  if (!from) return;
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((node) => {
    const parent = node.parentElement;
    if (parent && /^(SCRIPT|STYLE|TEXTAREA|NOSCRIPT)$/.test(parent.tagName)) return;
    if (node.nodeValue.includes(from)) node.nodeValue = node.nodeValue.split(from).join(to);
  });
}`);

helper('startPicker', ['copyText', 'toast'], String.raw`
// 元素選擇器工具：滑鼠移到元素上會框起來，點一下就複製它的選擇器
function startPicker() {
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;pointer-events:none;z-index:2147483646;border:2px solid #f08c00;background:rgba(240,140,0,.18);border-radius:3px;display:none;';
  document.documentElement.appendChild(box);
  toast('元素選擇器已啟動：請點選想要的元素（按 Esc 取消）', 4);
  const cssPath = (node) => {
    const parts = [];
    let el = node;
    while (el && el.nodeType === 1 && el !== document.documentElement) {
      if (el.id) { parts.unshift('#' + CSS.escape(el.id)); break; }
      let part = el.tagName.toLowerCase();
      const cls = Array.from(el.classList).slice(0, 2).map((c) => '.' + CSS.escape(c)).join('');
      if (cls) {
        part += cls;
      } else if (el.parentElement) {
        const same = Array.from(el.parentElement.children).filter((x) => x.tagName === el.tagName);
        if (same.length > 1) part += ':nth-of-type(' + (same.indexOf(el) + 1) + ')';
      }
      parts.unshift(part);
      try { if (document.querySelectorAll(parts.join(' > ')).length === 1) break; } catch (e) { /* 略過 */ }
      el = el.parentElement;
    }
    return parts.join(' > ');
  };
  const move = (e) => {
    const r = e.target.getBoundingClientRect();
    box.style.display = 'block';
    box.style.left = r.left + 'px';
    box.style.top = r.top + 'px';
    box.style.width = r.width + 'px';
    box.style.height = r.height + 'px';
  };
  const stop = () => {
    document.removeEventListener('mousemove', move, true);
    document.removeEventListener('click', pick, true);
    document.removeEventListener('keydown', key, true);
    box.remove();
  };
  const pick = (e) => {
    e.preventDefault();
    e.stopPropagation();
    const selector = cssPath(e.target);
    stop();
    copyText(selector);
    toast('已複製選擇器：' + selector, 5);
    console.log('[元素選擇器]', selector);
  };
  const key = (e) => {
    if (e.key === 'Escape') { stop(); toast('已取消元素選擇器'); }
  };
  document.addEventListener('mousemove', move, true);
  document.addEventListener('click', pick, true);
  document.addEventListener('keydown', key, true);
}`);

helper('el1', [], String.raw`
// 取得單一元素：可以傳入選擇器文字、元素，或元素陣列
function el1(target) {
  if (Array.isArray(target)) return target[0] || null;
  if (typeof target !== 'string') return target || null;
  if (!target.trim()) return null;
  try { return document.querySelector(target); }
  catch (e) { console.warn('無效的選擇器：', target); return null; }
}`);

helper('els', [], String.raw`
// 取得所有符合的元素（陣列）
function els(target) {
  if (Array.isArray(target)) return target;
  if (typeof target !== 'string') return target ? [target] : [];
  if (!target.trim()) return [];
  try { return Array.from(document.querySelectorAll(target)); }
  catch (e) { console.warn('無效的選擇器：', target); return []; }
}`);

helper('visible', [], String.raw`
// 元素現在看得到嗎（有大小、沒被隱藏）
function visible(el) {
  if (!el || !el.getBoundingClientRect) return false;
  const r = el.getBoundingClientRect();
  if (r.width === 0 && r.height === 0) return false;
  const s = getComputedStyle(el);
  return s.display !== 'none' && s.visibility !== 'hidden' && s.opacity !== '0';
}`);

// 一直往下捲，直到頁面不再變長（適合「無限捲動」的網站）
async function scrollToEnd(rounds = 10, wait = 1) {
  let last = -1;
  for (let i = 0; i < rounds; i++) {
    window.scrollTo(0, document.documentElement.scrollHeight);
    await sleep(wait * 1000);
    const height = document.documentElement.scrollHeight;
    if (height === last) break;
    last = height;
  }
}`);

// 發出提示音（瀏覽器通常要使用者點過網頁之後才允許發聲）
function beep(freq = 880, seconds = 0.2) {
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    const ctx = new Ctx();
    const osc = ctx.createOscillator();
    const gain = ctx.createGain();
    osc.frequency.value = freq;
    gain.gain.value = 0.2;
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start();
    setTimeout(() => { osc.stop(); ctx.close(); }, seconds * 1000);
  } catch (e) { console.warn('無法播放提示音：', e); }
}`);

helper('highlightText', [], String.raw`
// 把頁面上的某段文字標上螢光筆
function highlightText(text, color) {
  text = String(text);
  if (!text) return;
  const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);
  const nodes = [];
  while (walker.nextNode()) nodes.push(walker.currentNode);
  nodes.forEach((node) => {
    const parent = node.parentElement;
    if (!parent || /^(SCRIPT|STYLE|TEXTAREA|NOSCRIPT|MARK)$/.test(parent.tagName)) return;
    const value = node.nodeValue;
    if (!value.includes(text)) return;
    const frag = document.createDocumentFragment();
    value.split(text).forEach((part, i) => {
      if (i > 0) {
        const mark = document.createElement('mark');
        mark.textContent = text;
        mark.style.cssText = 'background:' + color + ';color:inherit;padding:0 2px;border-radius:2px;';
        frag.appendChild(mark);
      }
      if (part) frag.appendChild(document.createTextNode(part));
    });
    parent.replaceChild(frag, node);
  });
}`);

// ----- 文字按鈕：每個按鈕有一個名稱，之後可以用名稱改它的文字、顏色、位置… -----
const textButtons = Object.create(null);
const TBTN_STYLE = 'padding:10px 16px;border:0;border-radius:999px;background:#4c6ef5;color:#fff;font:600 14px system-ui,sans-serif;box-shadow:0 4px 14px rgba(0,0,0,.3);cursor:pointer;';
function tbtnGet(name) {
  const btn = textButtons[String(name)];
  return btn && btn.isConnected ? btn : null;
}
// 建立文字按鈕（同名的已經存在就只更新文字和位置）
function tbtnCreate(name, text, pos = 'br') {
  name = String(name);
  let btn = textButtons[name];
  if (!btn) {
    btn = document.createElement('button');
    btn.type = 'button';
    btn.style.cssText = TBTN_STYLE;
    btn.setAttribute('data-tm-btn', name);
    textButtons[name] = btn;
  }
  btn.textContent = String(text);
  tbtnMove(name, pos);
  return btn;
}
// 移到畫面的某個角落
function tbtnMove(name, pos = 'br') {
  const btn = textButtons[String(name)];
  if (!btn) { console.warn('找不到文字按鈕：', name); return; }
  btn.style.position = '';
  btn.style.left = '';
  btn.style.top = '';
  fabBox(pos).appendChild(btn);
}
// 放在畫面上的指定座標（以視窗左上角為 0,0）
function tbtnPlace(name, x, y) {
  const btn = textButtons[String(name)];
  if (!btn) { console.warn('找不到文字按鈕：', name); return; }
  btn.style.position = 'fixed';
  btn.style.left = Number(x) + 'px';
  btn.style.top = Number(y) + 'px';
  btn.style.zIndex = '2147483647';
  document.documentElement.appendChild(btn);
}
// 放進網頁裡某個元素的旁邊或裡面。pos：beforebegin / afterend / afterbegin / beforeend
function tbtnAttach(name, target, pos) {
  const btn = textButtons[String(name)];
  const el = el1(target);
  if (!btn || !el) { console.warn('找不到文字按鈕或目標元素：', name, target); return; }
  btn.style.position = '';
  btn.style.left = '';
  btn.style.top = '';
  el.insertAdjacentElement(pos, btn);
}
// 調整按鈕：prop 是 text / bg / fg / border / size / shape / tip / css / enabled / visible
function tbtnSet(name, prop, value) {
  const btn = tbtnGet(name);
  if (!btn) { console.warn('找不到文字按鈕：', name); return; }
  const s = btn.style;
  if (prop === 'text') btn.textContent = String(value);
  else if (prop === 'bg') s.setProperty('background', value, 'important');
  else if (prop === 'fg') s.setProperty('color', value, 'important');
  else if (prop === 'border') s.setProperty('border', '2px solid ' + value, 'important');
  else if (prop === 'size') {
    const z = ({ s: ['12px', '6px 12px'], m: ['14px', '10px 16px'], l: ['18px', '12px 22px'], xl: ['24px', '16px 28px'] })[value] || ['14px', '10px 16px'];
    s.fontSize = z[0];
    s.padding = z[1];
  } else if (prop === 'shape') s.borderRadius = ({ pill: '999px', round: '10px', square: '2px' })[value] || '999px';
  else if (prop === 'tip') btn.title = String(value);
  else if (prop === 'css') s.cssText += ';' + value;
  else if (prop === 'enabled') { btn.disabled = !value; s.opacity = value ? '' : '0.5'; s.cursor = value ? 'pointer' : 'not-allowed'; }
  else if (prop === 'visible') s.display = value ? '' : 'none';
}
function tbtnRemove(name) {
  const btn = textButtons[String(name)];
  if (btn) btn.remove();
  delete textButtons[String(name)];
}
function tbtnClick(name) {
  const btn = tbtnGet(name);
  if (btn) btn.click();
  else console.warn('找不到文字按鈕：', name);
}
function tbtnClear() {
  Object.keys(textButtons).forEach(tbtnRemove);
}`);

// ----- 嵌入網頁（iframe）：每個嵌入的網頁有一個名稱，之後可以用名稱調整 -----
const embeds = Object.create(null);
const embedSizeCss = (v, d) => {
  v = String(v == null ? '' : v).trim();
  return !v ? d : (/^\d+(\.\d+)?$/.test(v) ? v + 'px' : v);
};
// YouTube、Vimeo 的一般連結會自動換成可以嵌入的網址
function embedUrl(u) {
  u = String(u).trim();
  let m = u.match(/(?:youtube\.com\/watch\?(?:[^#]*&)?v=|youtu\.be\/|youtube\.com\/shorts\/)([\w-]{11})/);
  if (m) return 'https://www.youtube.com/embed/' + m[1];
  m = u.match(/vimeo\.com\/(\d+)/);
  if (m) return 'https://player.vimeo.com/video/' + m[1];
  return u;
}
// 設定內容：網址，或以 < 開頭的 HTML（HTML 會放在隔離的沙盒裡）
function embedSource(f, src) {
  if (/^\s*</.test(String(src))) {
    f.removeAttribute('src');
    f.setAttribute('sandbox', 'allow-scripts allow-forms allow-popups allow-modals');
    f.srcdoc = String(src);
  } else {
    f.removeAttribute('srcdoc');
    f.removeAttribute('sandbox');
    f.src = embedUrl(src);
  }
}
function embedFrame(src, w, h) {
  const f = document.createElement('iframe');
  embedSource(f, src);
  f.setAttribute('allow', 'fullscreen; autoplay; clipboard-write; encrypted-media; picture-in-picture');
  f.setAttribute('allowfullscreen', '');
  f.style.cssText = 'border:0;background:#fff;display:block;width:' + embedSizeCss(w, '100%') + ';height:' + embedSizeCss(h, '300px') + ';';
  return f;
}
function embedGet(name) {
  const e = embeds[String(name)];
  return e && e.box.isConnected ? e : null;
}
function embedRemove(name) {
  const e = embeds[String(name)];
  if (e) { if (e.cleanup) e.cleanup(); e.box.remove(); }
  delete embeds[String(name)];
}
function embedAdd(name, entry) {
  name = String(name);
  embedRemove(name);
  entry.frame.setAttribute('data-tm-embed', name);
  entry.display = entry.box.style.display;
  embeds[name] = entry;
  return entry;
}
// 避免「網頁裡嵌入的網頁」又執行同一支腳本、一層一層嵌下去：只在最上層的頁面建立
function embedOk() {
  if (window.top !== window.self) { console.warn('嵌入網頁只會在最上層的頁面建立'); return false; }
  return true;
}
function embedBarButton(text, title) {
  const b = document.createElement('button');
  b.type = 'button';
  b.textContent = text;
  b.title = title;
  b.style.cssText = 'border:0;background:transparent;color:#fff;font:600 14px system-ui,sans-serif;cursor:pointer;padding:2px 6px;border-radius:6px;';
  return b;
}
// 嵌在網頁裡某個元素的旁邊或裡面。pos：beforebegin / afterend / afterbegin / beforeend
function embedCreate(name, src, target, pos, w, h) {
  if (!embedOk()) return;
  const el = el1(target);
  if (!el) { console.warn('找不到要放置嵌入網頁的元素：', target); return; }
  const f = embedFrame(src, w, h);
  embedAdd(name, { box: f, frame: f, kind: 'inline', size: (nw, nh) => { f.style.width = embedSizeCss(nw, f.style.width); f.style.height = embedSizeCss(nh, f.style.height); } });
  el.insertAdjacentElement(pos, f);
}
// 把某個元素換成嵌入的網頁（大小和原本的元素一樣）
function embedReplace(name, target, src) {
  if (!embedOk()) return;
  const el = el1(target);
  if (!el) { console.warn('找不到要換掉的元素：', target); return; }
  const r = el.getBoundingClientRect();
  const f = embedFrame(src, r.width ? r.width + 'px' : '100%', r.height ? r.height + 'px' : '300px');
  embedAdd(name, { box: f, frame: f, kind: 'inline', size: (nw, nh) => { f.style.width = embedSizeCss(nw, f.style.width); f.style.height = embedSizeCss(nh, f.style.height); } });
  el.replaceWith(f);
}
function embedPlace(box, pos, index) {
  box.style.top = box.style.bottom = box.style.left = box.style.right = box.style.transform = '';
  if (pos === 'c') { box.style.left = '50%'; box.style.top = '50%'; box.style.transform = 'translate(-50%, -50%)'; return; }
  box.style[pos.charAt(0) === 't' ? 'top' : 'bottom'] = (16 + (index || 0) * 28) + 'px';   // 同一個角落的視窗會錯開一點
  box.style[pos.charAt(1) === 'l' ? 'left' : 'right'] = '16px';
}
// 浮動視窗：有標題列（可以拖曳、縮小、關閉）
function embedFloat(name, src, pos, w, h) {
  if (!embedOk()) return;
  pos = ['br', 'bl', 'tr', 'tl', 'c'].includes(pos) ? pos : 'br';
  const box = document.createElement('div');
  box.style.cssText = 'position:fixed;z-index:2147483646;display:flex;flex-direction:column;max-width:96vw;max-height:92vh;background:#fff;border:1px solid rgba(0,0,0,.25);border-radius:12px;box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;width:' + embedSizeCss(w, '360px') + ';';
  const bar = document.createElement('div');
  bar.style.cssText = 'display:flex;align-items:center;gap:4px;padding:6px 8px;background:#2b3245;color:#fff;font:600 13px system-ui,sans-serif;cursor:move;user-select:none;touch-action:none;';
  const title = document.createElement('span');
  title.textContent = String(name);
  title.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  const mini = embedBarButton('▁', '縮小或展開');
  const close = embedBarButton('✕', '關閉');
  bar.append(title, mini, close);
  const f = embedFrame(src, '100%', h || '280px');
  box.append(bar, f);
  const same = Object.keys(embeds).filter((k) => embeds[k].kind === 'float' && embeds[k].pos === pos && k !== String(name)).length;
  embedPlace(box, pos, same);
  document.documentElement.appendChild(box);
  mini.addEventListener('click', () => { f.style.display = f.style.display === 'none' ? 'block' : 'none'; });
  close.addEventListener('click', () => embedRemove(name));
  bar.addEventListener('pointerdown', (e) => {
    if (e.target.closest('button')) return;
    const r = box.getBoundingClientRect();
    box.style.left = r.left + 'px';
    box.style.top = r.top + 'px';
    box.style.right = box.style.bottom = box.style.transform = '';
    const dx = e.clientX - r.left, dy = e.clientY - r.top;
    bar.setPointerCapture(e.pointerId);
    const move = (ev) => {
      box.style.left = Math.max(0, Math.min(window.innerWidth - 60, ev.clientX - dx)) + 'px';
      box.style.top = Math.max(0, Math.min(window.innerHeight - 30, ev.clientY - dy)) + 'px';
    };
    const up = () => { bar.removeEventListener('pointermove', move); bar.removeEventListener('pointerup', up); };
    bar.addEventListener('pointermove', move);
    bar.addEventListener('pointerup', up);
  });
  embedAdd(name, {
    box, frame: f, kind: 'float', pos,
    size: (nw, nh) => { if (nw) box.style.width = embedSizeCss(nw, box.style.width); if (nh) f.style.height = embedSizeCss(nh, f.style.height); },
    move: (p) => embedPlace(box, p, 0),
  });
}
// 彈出視窗：背景變暗，點背景或按 Esc 關閉
function embedModal(name, src, w, h) {
  if (!embedOk()) return;
  const overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;z-index:2147483646;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;';
  const panel = document.createElement('div');

  const title = document.createElement('span');

  title.style.cssText = 'flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;';
  const close = embedBarButton('✕', '關閉');

function highlight(code) {

function fileToIcon(file, max = 96) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onerror = () => reject(new Error('讀不到這個檔案'));
    fr.onload = () => {
      const img = new Image();
      img.onerror = () => reject(new Error('這不是可以使用的圖片'));
      img.onload = () => {
        const nw = img.naturalWidth || max, nh = img.naturalHeight || max;
        const k = Math.min(1, max / Math.max(nw, nh));
        const w = Math.max(1, Math.round(nw * k)), hh = Math.max(1, Math.round(nh * k));
        const cv = document.createElement('canvas');
        cv.width = w; cv.height = hh;
        cv.getContext('2d').drawImage(img, 0, 0, w, hh);
        try { resolve(cv.toDataURL('image/png')); } catch (e) { reject(e); }
      };
      img.src = String(fr.result);
    };
    fr.readAsDataURL(file);
  });
}

/* ---------- 專案 ---------- */
function loadProject(o) {
  clearExtensions();
  const errs = [];
  (o.extensions || []).forEach((e) => { try { registerExtension(String(e.code || '')); } catch (err) { errs.push(String(err.message).split('\n')[0]); } });
  const ctx = loadWorkspace(o);
  view.selected = null;
  if (!catById(view.cat) || view.cat.startsWith('x:')) view.cat = 'event';
  resetHistory();
  renderCats(); renderPalette(); renderWorkspace();
  refreshCode();
  return { skipped: ctx.skipped, errs };
}
async function newProject() {
  if ((state.scripts.length || state.variables.length) && !(await uiConfirm({ title: '新增專案', message: '目前的積木會被清空（可以用「復原」找回）。要繼續嗎？', okText: '清空並新增', danger: true }))) return;
  clearExtensions();
  state.meta = defaultMeta(); state.variables = []; state.scripts = [];
  view.selected = null; view.cat = 'event';
  commit();
  renderCats(); renderPalette(); renderWorkspace();
}
async function openProjectFile(file) {
  let text;
  try { text = await readFileText(file); } catch (e) { notify('讀不到這個檔案'); return; }
  let obj = null;
  try { obj = extractEmbedded(text); } catch (e) { obj = null; }
  if (!obj) { try { const j = JSON.parse(text); if (j && (j.app === 'tm-blocks' || j.scripts)) obj = j; } catch (e) { /* 不是 JSON */ } }
  if (!obj) { notify('找不到專案資料。只有用這個編輯器匯出的腳本（有附上專案資料）或專案檔可以重新開啟', 5200); return; }
  if (state.scripts.length && !(await uiConfirm({ title: '開啟專案', message: '目前工作區的積木會被取代。要繼續嗎？', okText: '開啟' }))) return;
  const r = loadProject(obj);
  commit();
  notify(r.skipped || r.errs.length ? trf('已開啟，但有 {0} 個項目無法還原', r.skipped + r.errs.length) : trf('已開啟「{0}」', state.meta.name), 3600);
}
async function saveProjectFile() {
  const json = JSON.stringify(serializeProject(), null, 1);
  const r = await saveFile(fileSafeName(state.meta.name) + '.tmblocks.json', json, 'application/json;charset=utf-8');
  if (r.ok) notify(trf('已儲存專案檔 {0}', r.name), 3600);
  else if (r.declined) notify('已取消');
  else notify('這裡無法下載檔案。「匯出」的程式碼最後有附專案資料，可以用它重新開啟', 5200);
}
function applyTheme(mode, initial) {
  const root = document.documentElement;
  if (initial && mode !== 'light' && mode !== 'dark') return;   // 預設交給系統／檢視器決定，不要動它
  if (mode === 'light' || mode === 'dark') root.setAttribute('data-theme', mode); else root.removeAttribute('data-theme');
  if (!initial) storeSet('tmblocks.theme', mode);
}
function openProjectMenu(anchor) {

    setFav(op, !isFav(op));
    if (view.cat === 'fav' && !view.search) { renderPalette(); return; }   // 在「收藏」裡取消：整排更新
    const on = isFav(op);
    btn.classList.toggle('on', on); btn.textContent = on ? '★' : '☆';
    btn.title = tr(label()); btn.setAttribute('aria-label', tr(label()));
  };
  return btn;
}

const find = { open: false, q: '', hits: [], cur: -1 };
/** 一個積木可以被搜尋到的文字：積木上看得到的字、欄位裡填的內容、積木名稱（中英文都找得到） */
function findHay(b) {
  const d = DEFS[b.op];
  if (!d) return '';
  const vals = Object.values(b.args).filter((v) => typeof v === 'string' || typeof v === 'number').join(' ');
  return (labelText(b, d) + ' ' + vals + ' ' + labelPlain(d) + ' ' + b.op).toLowerCase();
}
function paintFind() {
  $$('#wsInner .found, #wsInner .found-cur').forEach((e) => e.classList.remove('found', 'found-cur'));
  find.hits.forEach((id, i) => { const el = findBlockEl(id); if (el) el.classList.add(i === find.cur ? 'found-cur' : 'found'); });
  $('#findCount').textContent = !find.open || !find.q.trim() ? '' : find.hits.length ? (find.cur + 1) + '/' + find.hits.length : tr('沒有符合');
}
function applyFind(keep) {
  const prev = keep ? find.hits[find.cur] : null;
  const terms = find.q.toLowerCase().split(/\s+/).filter(Boolean);   // 多個關鍵字要全部符合
  find.hits = [];
  if (find.open && terms.length) walkAll((b) => { const hay = findHay(b); if (terms.every((t) => hay.includes(t))) find.hits.push(b.id); });
  find.cur = find.hits.length ? Math.max(0, find.hits.indexOf(prev)) : -1;
  paintFind();
}
/** dir：1 下一個、-1 上一個、0 留在目前這個；並把它捲到工作區中間 */
function stepFind(dir) {
  if (!find.hits.length) return;
  find.cur = (find.cur + dir + find.hits.length) % find.hits.length;
  paintFind();
  const el = findBlockEl(find.hits[find.cur]);
  if (!el) return;
  const ws = $('#ws'), r = el.getBoundingClientRect(), w = ws.getBoundingClientRect();
  ws.scrollTo(ws.scrollLeft + r.left - w.left - Math.max(24, (w.width - r.width) / 2), ws.scrollTop + r.top - w.top - Math.max(64, (w.height - r.height) / 2));
}
function openFind() {
  find.open = true;
  $('#wsFind').hidden = false;
  const inp = $('#findInput');
  inp.focus(); inp.select();
  applyFind(true); stepFind(0);
}
function closeFind() { find.open = false; $('#wsFind').hidden = true; applyFind(false); }
function bindFind() {
  const inp = $('#findInput');
  $('#btnFind').onclick = () => (find.open ? closeFind() : openFind());
  $('#findClose').onclick = closeFind;
  $('#findNext').onclick = () => stepFind(1);
  $('#findPrev').onclick = () => stepFind(-1);
  inp.addEventListener('input', () => { find.q = inp.value; applyFind(false); stepFind(0); });
  inp.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); stepFind(e.shiftKey ? -1 : 1); }
    else if (e.key === 'Escape') { e.preventDefault(); closeFind(); }
  });
  window.addEventListener('keydown', (e) => {
    if ((e.ctrlKey || e.metaKey) && !e.altKey && !e.shiftKey && e.key.toLowerCase() === 'f' && !_modals.length && !drag.active) { e.preventDefault(); openFind(); }
  });
}

/** 載入範例時，把裡面的文字內容（名稱、提示文字…）翻成目前的介面語言 */
function localizeProject(p) {
  const L = (v) => (typeof v === 'string' ? tr(v) : v);
  const walk = (b) => {
    for (; b; b = b.next) {
      Object.keys(b.args).forEach((k) => { const v = b.args[k]; if (v && typeof v === 'object') walk(v); else b.args[k] = L(v); });
      (b.subs || []).forEach(walk);
    }
  };
  p.scripts.forEach((s) => walk(s.stack));
  if (p.meta) ['name', 'description'].forEach((k) => { if (p.meta[k]) p.meta[k] = tr(p.meta[k]); });
  (p.variables || []).forEach((v) => { v.name = tr(v.name); });
  return p;
}

  getDownloadsCap();
  onI18nChange(applyI18n);
  if (!restored && !storeGet('tmblocks.welcomed')) { storeSet('tmblocks.welcomed', '1'); setTimeout(openHelp, 250); }
}
// 被不明網站嵌入時（見檔案開頭的檢查）不要啟動
if (window.__tmGate) window.__tmGate.then((ok) => { if (ok) init(); });
else init();

</script>
