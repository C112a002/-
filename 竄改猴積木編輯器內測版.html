<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>竄改猴積木編輯器</title>
<style>
:root{
  --ui:"PingFang TC","Noto Sans TC","Microsoft JhengHei","Heiti TC",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --mono:ui-monospace,"SF Mono","Cascadia Mono",Menlo,Consolas,"Noto Sans Mono CJK TC","PingFang TC",monospace;
  --bg:#e8ecf3;--dot:#c3cbdf;--panel:#ffffff;--panel2:#f1f4f9;--ink:#1a2133;--muted:#657089;--line:#d4dae8;
  --accent:#f6c026;--accent-ink:#2b2200;--focus:#2f6bff;--danger:#d23a3a;--warn:#a4560a;--warn-bg:#fff1d9;--ok:#177a4a;
  --shadow:0 8px 28px rgba(22,32,64,.20);
  --code-bg:#f6f8fc;--code-ink:#25304a;--tk-com:#76829c;--tk-str:#0b7a4b;--tk-kw:#9b2bc9;--tk-num:#c2410c;--tk-meta:#2563eb;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#12151d;--dot:#252b3a;--panel:#1b2030;--panel2:#232a3d;--ink:#e6eaf5;--muted:#9aa4bd;--line:#303850;
    --focus:#6b9bff;--warn:#f0a95a;--warn-bg:#3a2a12;--ok:#5fd397;--shadow:0 8px 28px rgba(0,0,0,.55);
    --code-bg:#10131b;--code-ink:#d7def0;--tk-com:#7d89a6;--tk-str:#7fd6a5;--tk-kw:#d2a0ff;--tk-num:#ffb27a;--tk-meta:#8fb4ff;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#12151d;--dot:#252b3a;--panel:#1b2030;--panel2:#232a3d;--ink:#e6eaf5;--muted:#9aa4bd;--line:#303850;
  --focus:#6b9bff;--warn:#f0a95a;--warn-bg:#3a2a12;--ok:#5fd397;--shadow:0 8px 28px rgba(0,0,0,.55);
  --code-bg:#10131b;--code-ink:#d7def0;--tk-com:#7d89a6;--tk-str:#7fd6a5;--tk-kw:#d2a0ff;--tk-num:#ffb27a;--tk-meta:#8fb4ff;
  color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 var(--ui);overflow:hidden;
  -webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
#app{display:grid;grid-template-rows:auto minmax(0,1fr);height:100%}

/* ---------- 頂列 ---------- */
#topbar{display:flex;align-items:center;gap:8px;padding:0 12px;height:52px;background:var(--panel);border-bottom:1px solid var(--line);position:relative;z-index:30}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:16px;letter-spacing:.02em;white-space:nowrap}
.brand .logo{display:grid;place-items:center;width:32px;height:32px;border-radius:10px;background:var(--accent);font-size:19px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.16)}
.brand small{font-weight:500;color:var(--muted);font-size:12px}
.top-actions{margin-left:auto;display:flex;align-items:center;gap:4px}
.top-actions .sep{width:1px;height:22px;background:var(--line);margin:0 6px}
.ibtn,.tbtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;min-width:36px;padding:0 9px;border:0;background:transparent;border-radius:10px;cursor:pointer;font-weight:600;white-space:nowrap}
.ibtn{font-size:18px}
.ibtn:hover,.tbtn:hover{background:var(--panel2)}
.ibtn[disabled]{opacity:.35;cursor:default;background:transparent}
.tbtn .ic{font-size:16px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:36px;padding:7px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--panel2)}
.btn.primary{background:var(--accent);border-color:transparent;color:var(--accent-ink);box-shadow:inset 0 -3px 0 rgba(0,0,0,.14)}
.btn.primary:hover{filter:brightness(1.04);background:var(--accent)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 40%,var(--line))}
.btn.flat{border-color:transparent;background:transparent}
.btn.sm{min-height:30px;padding:4px 10px;font-size:13px;border-radius:8px}

/* ---------- 主版面 ---------- */
#main{display:grid;min-height:0;position:relative;
  grid-template-columns:76px 330px minmax(0,1fr);grid-template-areas:"cats pal ws";}
@media (min-width:1240px){#main{grid-template-columns:76px 330px minmax(0,1fr) 400px;grid-template-areas:"cats pal ws code"}}
#cats{grid-area:cats;display:flex;flex-direction:column;gap:2px;padding:8px 6px;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;overscroll-behavior:contain}
.cat{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px 7px;border:0;background:transparent;border-radius:12px;cursor:pointer;font-size:12px;font-weight:600;color:var(--muted);position:relative}
.cat .dot{width:22px;height:22px;border-radius:50%;background:var(--cc);box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.cat:hover{background:var(--panel2)}
.cat.on{background:var(--panel2);color:var(--ink)}
.cat.on::before{content:"";position:absolute;left:-6px;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--cc)}
.cat .cnt{position:absolute;top:4px;right:8px;min-width:16px;height:16px;border-radius:8px;background:var(--cc);color:#fff;font-size:10px;line-height:16px;text-align:center}
#btnPalToggle{display:none}

#palette{grid-area:pal;display:flex;flex-direction:column;min-width:0;min-height:0;background:var(--panel2);border-right:1px solid var(--line);position:relative}
#palette.del-zone::after{content:"🗑 放開就刪除";position:absolute;inset:0;display:grid;place-items:center;background:color-mix(in srgb,var(--danger) 86%,transparent);color:#fff;font-weight:700;font-size:16px;z-index:5;pointer-events:none}
.pal-search{padding:10px 10px 6px}
.pal-search input{width:100%;font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:10px;padding:7px 11px}
#palList{flex:1;min-height:0;overflow:auto;padding:4px 14px 40px;font-size:14px;overscroll-behavior:contain;touch-action:pan-y;--hole:var(--panel2)}
.pal-title{font-weight:800;font-size:15px;margin:8px 0 2px}
.pal-tip{font-size:12.5px;color:var(--muted);margin:0 0 10px;line-height:1.55}
.pal-item{margin:6px 0 12px;display:flex;align-items:flex-start;min-width:0}
.pal-item>.blk{max-width:100%}
.pal-item .blk{cursor:grab;touch-action:pan-y}
.pal-item .blk *{pointer-events:none}
.pal-sep{height:8px}
.pal-hint{display:flex;align-items:flex-start;gap:6px;margin:4px 0 8px;padding:7px 8px 7px 11px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:12.5px;line-height:1.5}
.pal-hint span{flex:1}
.pal-hint .btn{flex:none}
.pal-label{font-size:12px;color:var(--muted);margin:14px 0 4px;font-weight:700}
.pal-btns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.var-row{display:flex;align-items:center;gap:6px;margin:6px 0 10px}
.var-row .pal-item{margin:0;flex:0 1 auto;min-width:0}
.var-row .btn{padding:2px 8px;min-height:26px;font-size:12px}
.pal-empty{color:var(--muted);padding:18px 4px;font-size:13px}

/* ---------- 工作區 ---------- */
#wsWrap{grid-area:ws;position:relative;min-width:0;min-height:0;overflow:hidden}
#ws{position:absolute;inset:0;overflow:auto;touch-action:pan-x pan-y;overscroll-behavior:contain;cursor:default}
#ws.panning{cursor:grabbing}
#wsInner{position:relative;font-size:calc(14px * var(--z,1));--hole:var(--bg);
  background-image:radial-gradient(var(--dot) 1.3px,transparent 1.5px);background-size:calc(24px * var(--z,1)) calc(24px * var(--z,1));min-width:100%;min-height:100%}
.script{position:absolute;display:block}
.script.orphan{outline:2px dashed color-mix(in srgb,var(--warn) 70%,transparent);outline-offset:8px;border-radius:4px}
.orphan-tip{display:block;width:max-content;font-size:.82em;margin:0 0 .6em;color:var(--warn);background:var(--warn-bg);padding:1px 9px;border-radius:999px;font-weight:600;line-height:1.6}
#emptyHint{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;padding:20px}
#emptyHint .card{pointer-events:auto;max-width:360px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px 22px;box-shadow:var(--shadow);text-align:center}
#emptyHint h3{margin:0 0 6px;font-size:18px}
#emptyHint p{margin:0 0 14px;color:var(--muted)}
#emptyHint .row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
#wsCtl{position:absolute;right:12px;bottom:12px;display:flex;flex-direction:column;gap:6px;z-index:5}
#wsCtl .ibtn{background:var(--panel);border:1px solid var(--line);box-shadow:0 2px 8px rgba(20,30,60,.12);width:38px;height:38px}
#selBar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);z-index:6;display:none;align-items:center;gap:6px;padding:6px 8px 6px 14px;max-width:calc(100% - 72px);background:var(--ink);color:var(--panel);border-radius:999px;box-shadow:var(--shadow)}
#selBar.show{display:flex}
#selBar .nm{max-width:34vw;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600;font-size:13px}
#selBar button{border:0;border-radius:999px;padding:6px 12px;font-weight:700;cursor:pointer;background:rgba(255,255,255,.16);color:inherit;white-space:nowrap;flex:none}
#selBar button.del{background:var(--danger);color:#fff}
#selBar button:hover{filter:brightness(1.12)}

/* ---------- 積木 ---------- */
.blk{--c:#888;--cd:#666;--cl:#aaa;position:relative;color:#fff;font-weight:600;line-height:1.25;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none;text-shadow:0 1px 0 rgba(0,0,0,.14)}
.blk .row{display:flex;flex-wrap:wrap;align-items:center;gap:.28em .42em;min-width:0}
.blk .txt{white-space:pre-wrap;min-width:0}
.stk{display:flex;flex-direction:column;align-items:flex-start}
.blk.stack,.blk.hat,.blk.cap{display:flex;align-items:center;background:var(--c);border:1px solid var(--cd);border-radius:.4em;padding:.38em .8em;min-height:2.7em;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.blk.hat{border-radius:1.5em 1.5em .4em .4em / 1.15em 1.15em .4em .4em;padding-top:.8em;min-height:3.3em;margin-top:.3em}
.blk.stack::before,.blk.cap::before{content:"";position:absolute;left:1.05em;top:-1px;width:1.9em;height:.4em;background:rgba(0,0,0,.26);border-radius:0 0 .4em .4em}
.blk.stack::after,.blk.hat::after,.blk.c:not(.nobump)::after{content:"";position:absolute;left:1.05em;bottom:-.42em;width:1.9em;height:.42em;background:var(--c);border:1px solid var(--cd);border-top:0;border-radius:0 0 .4em .4em;z-index:2}
.blk.cap::after{display:none}
.blk.c{display:flex;flex-direction:column;background:var(--c);border:1px solid var(--cd);border-radius:.4em;padding:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.22)}
.blk.c::before{content:"";position:absolute;left:1.05em;top:-1px;width:1.9em;height:.4em;background:rgba(0,0,0,.26);border-radius:0 0 .4em .4em}
.blk.c>.row{padding:.38em .8em;min-height:2.7em}
.blk.c>.row.mid{padding-top:.3em;padding-bottom:.3em;min-height:2.2em}
.blk.c>.mouth{margin-left:1.15em;min-height:2.1em;padding:0 0 .45em 0;background:rgba(0,0,0,.2);box-shadow:inset 0 2px 3px rgba(0,0,0,.2);border-radius:.15em 0 0 .15em}
.blk.c>.mouth>.stk{min-height:1.6em}
.blk.c>.foot{height:1.25em}
.blk.reporter{display:inline-flex;align-items:center;vertical-align:middle;background:var(--c);border:1px solid var(--cd);border-radius:1.3em;padding:.14em .65em;min-height:1.95em;max-width:100%}
.blk.boolean{display:inline-flex;align-items:center;vertical-align:middle;position:relative;padding:.14em 1.1em;min-height:1.95em;max-width:100%}
.blk.boolean>.shape{position:absolute;inset:0;pointer-events:none;filter:drop-shadow(1px 0 0 var(--cd)) drop-shadow(-1px 0 0 var(--cd)) drop-shadow(0 1px 0 var(--cd)) drop-shadow(0 -1px 0 var(--cd))}
.blk.boolean>.shape::before{content:"";position:absolute;inset:0;background:var(--c);clip-path:polygon(.95em 0,calc(100% - .95em) 0,100% 50%,calc(100% - .95em) 100%,.95em 100%,0 50%)}
.blk.boolean>.row{position:relative;z-index:1}
.blk.unknown{background:#777;padding:.4em .8em;border-radius:.4em;display:inline-block}
.blk.sel{outline:3px solid var(--focus);outline-offset:2px}
.slot{display:inline-flex;align-items:center;vertical-align:middle;max-width:100%}
.slot.bool.empty{position:relative;min-width:2.8em;min-height:1.95em}
.slot.bool.empty::before{content:"";position:absolute;inset:0;background:rgba(0,0,0,.3);clip-path:polygon(.95em 0,calc(100% - .95em) 0,100% 50%,calc(100% - .95em) 100%,.95em 100%,0 50%)}
.slot.lit{background:#fff;color:#1b2233;text-shadow:none;border:1px solid rgba(0,0,0,.3);border-radius:.4em;min-height:1.8em;padding:0 .12em}
.slot.lit.num{border-radius:1em}
.slot.lit.nodrop{box-shadow:inset 0 0 0 1px rgba(0,0,0,.08)}
.slot.lit:focus-within{box-shadow:0 0 0 2px var(--focus)}
.slot.hl{outline:3px solid #fff;box-shadow:0 0 0 6px var(--focus);border-radius:.5em}
.grow{display:inline-grid;align-items:center}
.grow::after{content:attr(data-v) " ";visibility:hidden;white-space:pre;grid-area:1/1;padding:.12em .35em;min-width:1.5em;font-weight:600;pointer-events:none}
.grow>input,.grow>textarea{grid-area:1/1;width:100%;min-width:0;font:inherit;font-weight:600;color:inherit;background:transparent;border:0;outline:0;padding:.12em .35em;margin:0;text-align:center;border-radius:inherit}
.grow.area::after{white-space:pre-wrap;word-break:break-all;min-width:13em;max-width:26em;font-family:var(--mono);font-weight:500;line-height:1.35}
.grow.area>textarea{text-align:left;font-family:var(--mono);font-weight:500;line-height:1.35;resize:none;overflow:hidden;white-space:pre-wrap;word-break:break-all}
.grow.sel::after,.grow.plain::after,.grow.text::after{min-width:3.2em}
.slot.clr{background:transparent;border:0;padding:0}
.slot.clr input{width:2.4em;height:1.7em;padding:0;border:2px solid #fff;border-radius:.4em;background:none;cursor:pointer}
.dd{display:inline-flex;align-items:center;gap:.3em;vertical-align:middle;min-height:1.8em;padding:.06em .55em;background:var(--cd);color:#fff;border-radius:.4em;cursor:pointer;white-space:pre;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.dd::after{content:"▾";font-size:.78em;opacity:.9}
.blk.boolean .dd,.blk.reporter .dd{background:rgba(0,0,0,.22)}
#ws .blk{cursor:grab}
body.dragging,body.dragging *{cursor:grabbing!important}
@media (pointer:coarse){.grow{font-size:max(16px,1em)}}

#dragLayer{position:fixed;inset:0;pointer-events:none;z-index:1500;overflow:hidden}
.ghost{position:absolute;left:0;top:0;opacity:.94;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));will-change:transform;--hole:var(--bg)}
.snap{position:absolute;height:7px;border-radius:4px;background:#fff;box-shadow:0 0 0 2px var(--focus),0 0 12px var(--focus)}

/* ---------- 彈出選單 ---------- */
#popLayer{position:fixed;inset:0;z-index:3000;pointer-events:none}
#popLayer.on{pointer-events:auto}
.menu{position:fixed;min-width:130px;max-width:min(320px,92vw);max-height:min(52vh,420px);overflow:auto;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);padding:5px;font-size:14px;overscroll-behavior:contain}
.menu .mi{display:flex;align-items:center;gap:8px;padding:8px 11px;border-radius:8px;cursor:pointer;white-space:nowrap}
.menu .mi:hover{background:var(--panel2)}
.menu .mi.on{font-weight:800}
.menu .mi.on::after{content:"✓";margin-left:auto;padding-left:12px;color:var(--ok)}
.menu .mi.dim{color:var(--muted)}
.menu .sep{height:1px;background:var(--line);margin:4px 2px}
.menu .mh{padding:6px 11px 2px;font-size:12px;color:var(--muted);font-weight:700}

/* ---------- 對話框 ---------- */
#modalRoot{position:fixed;inset:0;z-index:2000;pointer-events:none}
.ov{position:absolute;inset:0;background:rgba(8,12,24,.55);display:flex;align-items:center;justify-content:center;padding:16px;pointer-events:auto;animation:fadein .14s ease-out}
.dlg{width:min(680px,100%);max-height:min(88vh,100%);display:flex;flex-direction:column;background:var(--panel);color:var(--ink);border-radius:18px;box-shadow:var(--shadow);overflow:hidden}
.dlg.wide{width:min(860px,100%)}
.dlg.narrow{width:min(420px,100%)}
.dlg>header{display:flex;align-items:center;gap:8px;padding:14px 18px 10px}
.dlg>header h2{margin:0;font-size:17px;flex:1}
.dlg>.body{padding:6px 18px 14px;overflow:auto;overscroll-behavior:contain}
.dlg>footer{display:flex;justify-content:flex-end;flex-wrap:wrap;gap:8px;padding:12px 18px;border-top:1px solid var(--line);background:var(--panel2)}
.dlg p{margin:0 0 10px}
.dlg .muted,.muted{color:var(--muted)}
.field{display:grid;gap:5px;margin:0 0 14px}
.field>label,.field>.lb{font-weight:700;font-size:13px}
.field .hint{font-size:12.5px;color:var(--muted);line-height:1.5}
.field input[type=text],.field input[type=search],.field textarea,.field select,.dlg textarea.code{font:inherit;width:100%;border:1px solid var(--line);border-radius:10px;padding:8px 11px;background:var(--panel2);color:var(--ink)}
.field textarea,.dlg textarea.code{font-family:var(--mono);font-size:13px;line-height:1.5;resize:vertical;min-height:90px;tab-size:2}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:3px 11px;font-size:12.5px;cursor:pointer;font-weight:600}
.chip:hover{border-color:var(--focus)}
.chk{display:flex;align-items:center;gap:8px;font-weight:600;cursor:pointer}
.chk input{width:18px;height:18px;accent-color:var(--focus)}
.callout{padding:10px 13px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);font-size:13px;line-height:1.6;margin:0 0 12px}
.callout.warn{background:var(--warn-bg);border-color:color-mix(in srgb,var(--warn) 40%,transparent);color:var(--warn)}
.callout.err{background:color-mix(in srgb,var(--danger) 12%,var(--panel));border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);white-space:pre-wrap}
.callout.ok{background:color-mix(in srgb,var(--ok) 12%,var(--panel));border-color:color-mix(in srgb,var(--ok) 40%,transparent);color:var(--ok)}
.tabs{display:flex;gap:4px;margin:0 0 12px;border-bottom:1px solid var(--line)}
.tab{border:0;background:transparent;padding:8px 12px;font-weight:700;color:var(--muted);cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--ink);border-color:var(--accent)}
.list{display:grid;gap:8px}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--panel2)}
.item .t{font-weight:700}
.item .d{font-size:12.5px;color:var(--muted)}
.item>div:first-child{flex:1;min-width:0}
.steps{counter-reset:s;list-style:none;margin:0 0 8px;padding:0;display:grid;gap:10px}
.steps li{counter-increment:s;display:grid;grid-template-columns:30px 1fr;gap:10px;align-items:start}
.steps li::before{content:counter(s);display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:var(--accent);color:var(--accent-ink);font-weight:800}
kbd{font:600 12px var(--mono);padding:1px 6px;border-radius:6px;border:1px solid var(--line);background:var(--panel2)}
code.i{font-family:var(--mono);font-size:12.5px;background:var(--panel2);border:1px solid var(--line);border-radius:6px;padding:0 5px}
@keyframes fadein{from{opacity:0}to{opacity:1}}

/* ---------- 程式碼面板 ---------- */
#codePane{grid-area:code;display:none;flex-direction:column;min-width:0;min-height:0;background:var(--panel);border-left:1px solid var(--line)}
@media (min-width:1240px){#codePane{display:flex}#btnCodeClose{display:none}#btnExport{display:none}}
#codePane.open{display:flex}
.cp-head{display:flex;align-items:center;gap:8px;padding:10px 12px 6px}
.cp-head b{font-size:15px;flex:1}

  <header id="topbar">

<script>
'use strict';
/* =====================================================================
   竄改猴積木編輯器 — 純前端、單一檔案
   結構：工具 → 積木定義 → 資料模型 → 程式碼產生 → 擴充匯入 → 編輯器 → 介面 → 初始化
   ===================================================================== */

/* ---------- 小工具 ---------- */
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const clamp = (n, a, b) => Math.min(b, Math.max(a, n));
const q = JSON.stringify;

function h(tag, attrs, ...kids) {
  const el = document.createElement(tag);
  if (attrs) {
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k === 'class') el.className = v;
      else if (k === 'style' && typeof v === 'object') Object.assign(el.style, v);
      else if (k === 'text') el.textContent = v;
      else if (k === 'dataset') Object.assign(el.dataset, v);
      else if (k.startsWith('on') && typeof v === 'function') el.addEventListener(k.slice(2), v);
      else el.setAttribute(k, v === true ? '' : v);
    }
  }
  for (const kid of kids.flat(Infinity)) {
    if (kid == null || kid === false) continue;
    el.append(kid.nodeType ? kid : document.createTextNode(String(kid)));
  }
  return el;
}

function debounce(fn, ms) {
  let t;
  const d = (...a) => { clearTimeout(t); t = setTimeout(() => fn(...a), ms); };
  d.flush = (...a) => { clearTimeout(t); fn(...a); };
  return d;
}

function storeGet(k) { try { return localStorage.getItem(k); } catch (e) { return null; } }
function storeSet(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } }

function hexToRgb(hex) {
  const m = /^#?([\da-f]{3}|[\da-f]{6})$/i.exec(hex || '');
  if (!m) return [136, 136, 136];
  let s = m[1];
  if (s.length === 3) s = s.split('').map((c) => c + c).join('');
  const n = parseInt(s, 16);
  return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
}
function rgbToHex(r, g, b) {
  return '#' + [r, g, b].map((v) => clamp(Math.round(v), 0, 255).toString(16).padStart(2, '0')).join('');
}
/** amt < 0 變暗、amt > 0 變亮（-1 ~ 1） */
function shade(hex, amt) {
  const [r, g, b] = hexToRgb(hex);
  const t = amt < 0 ? 0 : 255, p = Math.abs(amt);
  return rgbToHex(r + (t - r) * p, g + (t - g) * p, b + (t - b) * p);
}

function utf8ToB64(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  for (let i = 0; i < bytes.length; i += 0x8000) bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
  return btoa(bin);
}
function b64ToUtf8(b64) {
  const bin = atob(b64);
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) bytes[i] = bin.charCodeAt(i);
  return new TextDecoder().decode(bytes);
}
function escapeHtml(s) {
  return String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}
function fileSafeName(name, fallback = 'script') {
  const s = String(name || '').trim().replace(/[\\/:*?"<>|\u0000-\u001f]+/g, '_').replace(/\s+/g, '-');
  return s || fallback;
}

/* ---------- 複製與下載 ---------- */
async function copyToClipboard(text) {
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(text); return true; }
  } catch (e) { /* 改用備用方式 */ }
  try {
    const ta = h('textarea', { style: { position: 'fixed', left: '-9999px', top: '0', opacity: '0' } });
    ta.value = text;
    document.body.append(ta);
    ta.focus(); ta.select(); ta.setSelectionRange(0, text.length);
    const ok = document.execCommand('copy');
    ta.remove();
    return !!ok;
  } catch (e) { return false; }
}

let _downloadsCap;
async function getDownloadsCap() {
  if (_downloadsCap !== undefined) return _downloadsCap;
  _downloadsCap = null;
  try {
    if (window.claude && typeof window.claude.use === 'function') _downloadsCap = (await window.claude.use('downloads')) || null;
  } catch (e) { _downloadsCap = null; }
  return _downloadsCap;
}
/** 回傳 {ok, name, renamed, declined} */
async function saveFile(filename, text, mime) {
  const cap = await getDownloadsCap();
  if (cap) {
    // 檢視器只接受特定副檔名（.js 不在名單內），所以腳本檔會多加 .txt
    let name = filename;
    if (/\.js$/i.test(name)) name += '.txt';
    try {
      await cap.save({ filename: name, data: text });
      return { ok: true, name, renamed: name !== filename };
    } catch (e) {
      if (e && e.code === 'declined') return { ok: false, declined: true };
    }
  }
  try {
    const blob = new Blob([text], { type: mime || 'text/plain;charset=utf-8' });
    const url = URL.createObjectURL(blob);
    const a = h('a', { href: url, download: filename });
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 3000);
    return { ok: true, name: filename };
  } catch (e) { return { ok: false, error: e }; }
}
function readFileText(file) {
  if (file.text) return file.text();
  return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result)); r.onerror = rej; r.readAsText(file); });
}

/* ---------- 提示、選單、對話框 ---------- */
function notify(msg, ms = 2600) {
  const root = $('#toastRoot');
  while (root.children.length >= 2) root.firstChild.remove();   // 最多同時顯示 2 則
  const t = h('div', { class: 'toast', role: 'status', text: msg });
  root.append(t);
  setTimeout(() => t.remove(), ms);
}

let _menu = null;
function closeMenu() {
  if (!_menu) return;
  const layer = $('#popLayer');
  layer.classList.remove('on'); layer.textContent = '';
  window.removeEventListener('keydown', _menu.onKey, true);
  _menu = null;
}
/** items: {label,value,on,dim,sep,header,onPick} */
function openMenu(anchor, items, opt = {}) {
  closeMenu();
  const layer = $('#popLayer');
  const menu = h('div', { class: 'menu', role: 'menu' });
  items.forEach((it) => {
    if (it.sep) { menu.append(h('div', { class: 'sep' })); return; }
    if (it.header) { menu.append(h('div', { class: 'mh', text: it.header })); return; }
    const mi = h('div', { class: 'mi' + (it.on ? ' on' : '') + (it.dim ? ' dim' : ''), role: 'menuitem', text: it.label });
    mi.addEventListener('click', (e) => { e.stopPropagation(); closeMenu(); if (it.onPick) it.onPick(it.value); });
    menu.append(mi);
  });
  layer.append(menu);
  layer.classList.add('on');
  const r = anchor.getBoundingClientRect ? anchor.getBoundingClientRect() : { left: anchor.x, right: anchor.x, top: anchor.y, bottom: anchor.y };
  const vw = window.innerWidth, vh = window.innerHeight;
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = opt.alignRight ? r.right - mw : r.left;
  left = clamp(left, 8, Math.max(8, vw - mw - 8));
  let top = r.bottom + 4;
  if (top + mh > vh - 8) top = Math.max(8, r.top - mh - 4);
  if (top + mh > vh - 8) top = Math.max(8, vh - mh - 8);
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  const on = menu.querySelector('.mi.on');
  if (on) menu.scrollTop = Math.max(0, on.offsetTop - menu.clientHeight / 2);
  layer.onpointerdown = (e) => { if (e.target === layer) closeMenu(); };
  layer.oncontextmenu = (e) => { e.preventDefault(); closeMenu(); };
  const onKey = (e) => { if (e.key === 'Escape') { e.preventDefault(); closeMenu(); } };
  window.addEventListener('keydown', onKey, true);
  _menu = { onKey };
}

const _modals = [];
function openModal({ title, body, footer, cls = '', onClose, dismissible = true }) {
  const ov = h('div', { class: 'ov' });
  const dlg = h('div', { class: 'dlg ' + cls, role: 'dialog', 'aria-modal': 'true', 'aria-label': title });
  let closed = false;
  const api = {
    el: dlg,
    close(v) {
      if (closed) return;
      closed = true;
      ov.remove();
      const i = _modals.indexOf(api);
      if (i >= 0) _modals.splice(i, 1);
      if (onClose) onClose(v);
    },
    dismissible,
  };
  dlg.append(h('header', null, h('h2', { text: title }), h('button', { class: 'ibtn', 'aria-label': '關閉', text: '✕', onclick: () => api.close() })));
  const bodyEl = h('div', { class: 'body' });
  (Array.isArray(body) ? body : [body]).forEach((n) => n && bodyEl.append(n));
  dlg.append(bodyEl);
  api.body = bodyEl;
  if (footer && footer.length) dlg.append(h('footer', null, ...footer));
  ov.append(dlg);
  ov.addEventListener('pointerdown', (e) => { if (e.target === ov && dismissible) api.close(); });
  $('#modalRoot').append(ov);
  _modals.push(api);
  return api;
}
window.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && _modals.length && !_menu) {
    const m = _modals[_modals.length - 1];
    if (m.dismissible) { e.preventDefault(); m.close(); }
  }
});

function uiPrompt({ title, label, value = '', placeholder = '', okText = '確定', hint = '' }) {
  return new Promise((resolve) => {
    const input = h('input', { type: 'text', value, placeholder, autocomplete: 'off', spellcheck: 'false' });
    let result = null;
    const ok = h('button', { class: 'btn primary', text: okText });
    const cancel = h('button', { class: 'btn', text: '取消' });
    const m = openModal({
      title, cls: 'narrow',
      body: h('div', { class: 'field' }, label ? h('label', { text: label }) : null, input, hint ? h('div', { class: 'hint', text: hint }) : null),
      footer: [cancel, ok],
      onClose: () => resolve(result),
    });
    const submit = () => { result = input.value; m.close(); };
    ok.onclick = submit;
    cancel.onclick = () => m.close();
    input.addEventListener('keydown', (e) => { if (e.key === 'Enter' && !e.isComposing) { e.preventDefault(); submit(); } });
    setTimeout(() => { input.focus(); input.select(); }, 30);
  });
}
function uiConfirm({ title = '請確認', message, okText = '確定', danger = false }) {
  return new Promise((resolve) => {
    let result = false;
    const ok = h('button', { class: 'btn ' + (danger ? 'danger' : 'primary'), text: okText });
    const cancel = h('button', { class: 'btn', text: '取消' });
    const m = openModal({ title, cls: 'narrow', body: h('p', { text: message }), footer: [cancel, ok], onClose: () => resolve(result) });
    ok.onclick = () => { result = true; m.close(); };
    cancel.onclick = () => m.close();
    setTimeout(() => ok.focus(), 30);
  });
}

/* =====================================================================
   積木分類、參數型別與所有內建積木
   ===================================================================== */
const CATS = [
  { id: 'event', name: '事件', color: '#c27c00', tip: '每段程式都從「事件」積木開始：決定「什麼時候」要執行下面的積木。' },
  { id: 'ctl', name: '控制', color: '#d9731a', tip: '等待、重複、判斷。像是「如果…那麼…」或「重複 10 次」。' },
  { id: 'act', name: '動作', color: '#2f6fdb', tip: '替你操作網頁：點擊按鈕、輸入文字、捲動、換頁。「元素選擇器」就是告訴積木要操作哪個東西，例如 #id、.class。不知道怎麼寫？到「進階」拿「元素選擇器工具」，點一下網頁上的元素就能複製。' },
  { id: 'dom', name: '網頁外觀', color: '#7c4dde', tip: '改變網頁的樣子：隱藏廣告、換顏色、改文字、加入新內容。' },
  { id: 'ui', name: '訊息', color: '#c040b0', tip: '跟使用者說話：彈出視窗、浮動提示、桌面通知。' },
  { id: 'sense', name: '偵測', color: '#1790bd', tip: '讀取網頁資訊：目前網址、元素的文字、頁面上有沒有某個東西。這些圓形積木可以放進其他積木的空格。' },
  { id: 'op', name: '運算', color: '#2e9e44', tip: '加減乘除、比較大小、處理文字。圓形和六角形的積木可以拖進其他積木的空格裡。' },
  { id: 'var', name: '變數', color: '#d9482b', tip: '變數像是會記住東西的盒子，例如「分數」。清單可以放很多項目。' },
  { id: 'func', name: '函式', color: '#e0446a', tip: '把一組積木包成一個函式，之後用「執行函式」重複使用。' },
  { id: 'net', name: '網路儲存', color: '#0f8f8f', tip: '連到網路抓資料，或把資料永久存在瀏覽器（關掉網頁也還在）。' },
  { id: 'tool', name: '進階', color: '#5b6472', tip: '註解、元素選擇器工具，以及直接寫 JavaScript 的積木。' },
];
const extCats = [];
const allCats = () => CATS.concat(extCats);
const catById = (id) => allCats().find((c) => c.id === id) || CATS[CATS.length - 1];

/* ---------- 參數型別 ----------
   text 文字(可放積木) | any 文字或數字(可放積木) | num 數字(可放積木) | sel 元素選擇器(可放積木)
   plain 純文字(不可放積木) | pnum 純數字(不可放積木) | area 多行文字 | color 顏色 | bool 條件(六角形) | dd 下拉選單 */

const DEFS = Object.create(null);
function parseLabel(str) {
  const parts = []; const re = /\{(\w+)\}/g; let last = 0, m;
  while ((m = re.exec(str))) {
    if (m.index > last) parts.push({ t: 'text', v: str.slice(last, m.index) });
    parts.push({ t: 'arg', n: m[1] });
    last = re.lastIndex;
  }
  if (last < str.length) parts.push({ t: 'text', v: str.slice(last) });
  return parts;
}
/** type: hat | stack | c | reporter | boolean ；label 可含 {參數}；C 型積木可傳入多段文字 */
function def(op, cat, type, label, args, gen, extra) {
  const raw = Array.isArray(label) ? label : [label];
  const d = Object.assign({
    op, cat, type, args: args || {}, gen, labelRaw: raw, labels: raw.map(parseLabel),
    nsub: type === 'c' ? raw.length : 0,
    rt: type === 'boolean' ? 'bool' : (type === 'reporter' ? 'any' : null),

}

/* ---------- 產生程式碼用的小函式 ---------- */
const ind = (s, n = 1) => String(s).split('\n').map((l) => (l ? '  '.repeat(n) + l : l)).join('\n');
const fnb = (head, body, tail) => head + '\n' + (String(body).trim() ? ind(body) + '\n' : '') + tail;
const isNumLit = (e) => /^-?\d+(\.\d+)?$/.test(e);
const ms = (e) => (isNumLit(e) ? String(Math.round(Number(e) * 1000)) : e + ' * 1000');
const minus1 = (e) => (isNumLit(e) ? String(Number(e) - 1) : '(' + e + ' - 1)');
const S = (e) => (/^"(?:[^"\\\n]|\\.)*"$/.test(e) ? e : 'String(' + e + ')');
const SIMPLE_EXPR = /^(?:"(?:[^"\\\n]|\\.)*"|-?\d+(?:\.\d+)?|[\p{L}_$][\p{L}\p{N}_$]*|true|false|null|undefined)$/u;
/** 對每個符合的元素套用動作。複雜的值（例如含 await 的積木）先算好一次，不要每個元素都重算 */
function each(sel, vals, tpl) {
  const hoist = [];
  const use = vals.map((v, i) => {
    if (SIMPLE_EXPR.test(v)) return v;
    const name = i ? 'val' + (i + 1) : 'val';
    hoist.push('const ' + name + ' = ' + v + ';');
    return name;
  });
  const core = 'els(' + sel + ').forEach((el) => ' + tpl.replace(/\$(\d)/g, (m, i) => use[Number(i)]) + ');';
  return hoist.length ? '{\n' + ind(hoist.join('\n') + '\n' + core) + '\n}' : core;
}

helper('el1', [], String.raw`
// 取得單一元素：可以傳入選擇器文字，也可以直接傳入元素
function el1(target) {
  if (typeof target !== 'string') return target || null;
  try { return document.querySelector(target); }
  catch (e) { console.warn('無效的選擇器：', target); return null; }
}`);

helper('els', [], String.raw`
// 取得所有符合的元素（陣列）
function els(target) {
  if (typeof target !== 'string') return target ? [target] : [];
  try { return Array.from(document.querySelectorAll(target)); }
  catch (e) { console.warn('無效的選擇器：', target); return []; }
}`);

helper('addCSS', [], String.raw`
function addCSS(css) {
  if (typeof GM_addStyle === 'function') return GM_addStyle(css);
  const style = document.createElement('style');
  style.textContent = css;
  (document.head || document.documentElement).appendChild(style);
  return style;
}`);

helper('hide', ['addCSS', 'els'], String.raw`
const hiddenRules = {};
function hide(target) {
  if (typeof target === 'string') {
    if (!hiddenRules[target]) hiddenRules[target] = addCSS(target + ' { display: none !important; }');
  } else if (target) {
    target.style.setProperty('display', 'none', 'important');
  }
}
function show(target) {
  if (typeof target === 'string') {
    if (hiddenRules[target]) { hiddenRules[target].remove(); delete hiddenRules[target]; }
    els(target).forEach((el) => el.style.removeProperty('display'));
  } else if (target) {
    target.style.removeProperty('display');
  }
}`);
HELP.show = HELP.hide;
DEFS.dom_show.helpers = ['hide'];
DEFS.dom_hide.helpers = ['hide'];

helper('onAppear', ['els'], String.raw`
// 元素出現時（包含之後才動態出現的）執行一次
function onAppear(selector, callback) {
  const seen = new WeakSet();
  let timer = null;
  const scan = () => {
    timer = null;
    els(selector).forEach((el) => {
      if (seen.has(el)) return;
      seen.add(el);
      callback(el);
    });
  };
  scan();
  new MutationObserver(() => { if (!timer) timer = setTimeout(scan, 100); })
    .observe(document.documentElement, { childList: true, subtree: true });
}`);

helper('waitFor', ['el1'], String.raw`
// 等到元素出現（最多等 timeout 秒），回傳該元素，逾時回傳 null
function waitFor(selector, timeout = 10) {
  return new Promise((resolve) => {
    const found = el1(selector);
    if (found) return resolve(found);
    const timer = setTimeout(() => { observer.disconnect(); resolve(null); }, timeout * 1000);
    const observer = new MutationObserver(() => {
      const el = el1(selector);
      if (el) { clearTimeout(timer); observer.disconnect(); resolve(el); }
    });
    observer.observe(document.documentElement, { childList: true, subtree: true, attributes: true });
  });
}`);

helper('onUrlChange', [], String.raw`
// 偵測網址變化（單頁式網站換頁時網址會變，但頁面不會重新載入）
function onUrlChange(callback) {
  let last = location.href;
  const check = () => {
    if (location.href === last) return;
    last = location.href;
    callback(last);
  };
  ['pushState', 'replaceState'].forEach((name) => {
    const original = history[name];
    history[name] = function () {
      const result = original.apply(this, arguments);
      setTimeout(check, 0);
      return result;
    };
  });
  window.addEventListener('popstate', check);
  window.addEventListener('hashchange', check);
  setInterval(check, 800);
}`);

// 使用者選取文字之後執行
function onSelect(callback) {
  let last = '';
  const check = () => {
    const text = String(window.getSelection()).trim();
    if (text && text !== last) callback(text);
    last = text;
  };
  ['mouseup', 'touchend', 'keyup'].forEach((type) => document.addEventListener(type, () => setTimeout(check, 10)));
}`);

helper('setValue', ['els'], String.raw`
// 在輸入框填入文字（會通知網頁，React / Vue 等網站也能收到）
function setValue(target, value) {
  els(target).forEach((el) => {
    if (el.isContentEditable) {
      el.textContent = value;
    } else {
      const desc = Object.getOwnPropertyDescriptor(Object.getPrototypeOf(el), 'value');
      if (desc && desc.set) desc.set.call(el, value);
      else el.value = value;
    }
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  });
}`);

// 選擇下拉選單的選項（可以用選項文字或選項值）
function setSelect(target, value) {
  els(target).forEach((el) => {
    const option = Array.from(el.options || []).find((o) => o.value === String(value) || o.text.trim() === String(value));
    el.value = option ? option.value : value;
    el.dispatchEvent(new Event('input', { bubbles: true }));
    el.dispatchEvent(new Event('change', { bubbles: true }));
  });
}`);

function fire(target, type) {
  const isMouse = /^(click|dblclick|mousedown|mouseup|mouseover|mouseout|mousemove|contextmenu)$/.test(type);
  els(target).forEach((el) => {
    el.dispatchEvent(isMouse
      ? new MouseEvent(type, { bubbles: true, cancelable: true, view: window })
      : new Event(type, { bubbles: true, cancelable: true }));
  });
}`);

      });
    }
    if (td.type !== 'hat' && !tailCap && scriptOfHead(tb)) consider({ kind: 'before', block: tb, x: r.left, y: r.top, w: r.width }, Math.hypot(bot.x - r.left, bot.y - r.top));
  });

  let sn = drag.snap;

  if (cand.kind === 'slot') { cand.el.classList.add('hl'); if (sn) sn.style.display = 'none'; return; }
  if (!sn) { sn = drag.snap = h('div', { class: 'snap' }); $('#dragLayer').append(sn); }
  sn.style.display = 'block';

  sn.style.top = (cand.y - 3) + 'px';

  const gr = drag.ghost.getBoundingClientRect();

  drag.ghost.remove();
  if (drag.snap) { drag.snap.remove(); drag.snap = null; }

  $('#palette').classList.remove('del-zone');

  } else if (cand) {
    applyCandidate(cand, chain, gr);
  } else {
    const p = toWs(gr.left, gr.top);
    state.scripts.push({ x: clamp(p.x, 8, 30000), y: clamp(p.y, 8, 30000), stack: chain });

function applyCandidate(cand, chain, gr) {
  const tail = lastOf(chain);
  switch (cand.kind) {
    case 'after': tail.next = cand.block.next; cand.block.next = chain; break;
    case 'sub': tail.next = cand.block.subs[cand.idx]; cand.block.subs[cand.idx] = chain; break;
    case 'before': {
      const s = scriptOfHead(cand.block);
      tail.next = s.stack; s.stack = chain;
      const p = toWs(gr.left, gr.top);
      s.x = Math.max(8, p.x); s.y = Math.max(8, p.y);
      break;
    }
    case 'slot': {
      const old = cand.block.args[cand.arg];
      cand.block.args[cand.arg] = chain;
      if (old && typeof old === 'object') {
        const r = cand.el.getBoundingClientRect();
        const p = toWs(r.left + 24, r.top + 40);
        state.scripts.push({ x: Math.max(8, p.x), y: Math.max(8, p.y), stack: old });
      }
      break;
    }
    default: break;
  }
  view.selected = chain.id;

function highlight(code) {
  const re = /(\/\/[^\n]*|\/\*[\s\S]*?\*\/)|("(?:[^"\\\n]|\\.)*"|'(?:[^'\\\n]|\\.)*'|`(?:[^`\\]|\\.)*`)|\b(const|let|var|function|async|await|return|if|else|for|while|of|in|new|true|false|null|undefined|typeof|break|continue|class|this|try|catch|throw)\b|(\b\d+(?:\.\d+)?\b)/g;
  let out = '', last = 0, m;
  while ((m = re.exec(code))) {
    out += escapeHtml(code.slice(last, m.index));
    const txt = m[0];
    const cls = m[1] ? (/^\/\/ (@|==)/.test(txt) ? 'meta' : 'com') : m[2] ? 'str' : m[3] ? 'kw' : 'num';
    out += '<span class="' + cls + '">' + escapeHtml(txt) + '</span>';
    last = re.lastIndex;
  }
  return out + escapeHtml(code.slice(last));
}

    { label: '淺色', on: theme === 'light', onPick: () => applyTheme('light') },
    { label: '深色', on: theme === 'dark', onPick: () => applyTheme('dark') },

}

/* ---------- 自訂積木（匯入 JavaScript） ---------- */
function openExtDialog(prefill) {
  const status = h('div');
  const ta = h('textarea', { class: 'code', rows: 12, spellcheck: 'false', placeholder: '把 TurboWarp 風格的擴充 JavaScript 貼在這裡…' });
  ta.value = prefill || '';
  const listBox = h('div', { class: 'list', style: { marginBottom: '14px' } });
  const fillList = () => {
    listBox.textContent = '';
    if (!state.extensions.length) { listBox.append(h('div', { class: 'callout', text: '還沒有自訂積木。從下面匯入一個 JavaScript 檔，或先載入範例看看。' })); return; }
    state.extensions.forEach((e) => {
      const used = (() => { let n = 0; walkAll((b) => { if (b.op.startsWith('x:' + e.id + ':')) n++; }); return n; })();
      listBox.append(h('div', { class: 'item' },
        h('div', null, h('div', { class: 't', text: e.name }), h('div', { class: 'd', text: e.ops.length + ' 個積木' + (used ? '・工作區用了 ' + used + ' 個' : '') })),
        h('button', { class: 'btn sm', text: '編輯程式碼', onclick: () => { ta.value = e.code; status.textContent = ''; ta.scrollIntoView({ block: 'center' }); } }),
        h('button', { class: 'btn sm danger', text: '移除', onclick: async () => {
          if (used && !(await uiConfirm({ title: '移除「' + e.name + '」', message: '工作區有 ' + used + ' 個這個擴充的積木，移除後也會一併刪除。要繼續嗎？', okText: '移除', danger: true }))) return;
          unregisterExtension(e.id);
          if (view.cat === 'x:' + e.id) view.cat = 'event';
          view.selected = null;
          hist.undo = []; hist.redo = [];
          renderCats(); renderPalette(); renderWorkspace(); commit(); fillList();
        } })));
    });
  };
  const addBtn = h('button', { class: 'btn primary', text: '加入積木' });
  const doAdd = () => {
    status.textContent = '';
    const code = ta.value;
    if (!code.trim()) { status.append(h('div', { class: 'callout err', text: '請先貼上或選擇一個 JavaScript 檔。' })); return; }
    try {
      const r = registerExtension(code);
      view.cat = 'x:' + r.ext.id; view.search = ''; $('#palSearch').value = '';
      $('#main').classList.remove('pal-off');
      renderCats(); renderPalette(); renderWorkspace(); commit();
      notify((r.replaced ? '已更新' : '已加入') + '「' + r.ext.name + '」：' + r.ext.ops.length + ' 個積木', 3600);
      m.close();
    } catch (err) {
      status.append(h('div', { class: 'callout err', text: '無法加入：' + err.message }));
    }
  };
  addBtn.onclick = doAdd;
  const samples = h('div', { class: 'chips' }, EXT_SAMPLES.map((s) => h('button', { class: 'chip', type: 'button', title: s.desc, text: s.title, onclick: () => { ta.value = s.code; status.textContent = ''; status.append(h('div', { class: 'callout', text: s.desc + '。按「加入積木」就會出現在積木庫。' })); } })));
  const fileBtn = h('button', { class: 'btn sm', text: '選擇 .js 檔案', onclick: () => $('#fileExt').click() });
  $('#fileExt').onchange = async (e) => {
    const f = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!f) return;
    try { ta.value = await readFileText(f); status.textContent = ''; status.append(h('div', { class: 'callout', text: '已讀取「' + f.name + '」。確認內容後按「加入積木」。' })); }
    catch (err) { status.append(h('div', { class: 'callout err', text: '讀不到這個檔案' })); }
  };
  // 表單產生範本
  const fKind = h('select', null, [['command', '指令（做一件事）'], ['reporter', '數值（回傳一個值）'], ['boolean', '條件（回傳 是／否）']].map(([v, l]) => h('option', { value: v, text: l })));
  const fName = h('input', { type: 'text', value: '我的積木', autocomplete: 'off' });
  const fText = h('input', { type: 'text', value: '把 [文字] 加上驚嘆號', autocomplete: 'off' });
  const gen = h('button', { class: 'btn sm', text: '產生範本程式碼', onclick: () => {
    ta.value = buildExtTemplate({ name: fName.value.trim() || '我的積木', kind: fKind.value, text: fText.value.trim() || '我的積木', id: 'my' + Math.random().toString(36).slice(2, 6) });
    status.textContent = '';
    status.append(h('div', { class: 'callout ok', text: '範本已產生在上方。把 myBlock 方法裡的程式改成你要的功能，再按「加入積木」。' }));
    ta.scrollIntoView({ block: 'center' });
  } });
  const form = h('details', { style: { margin: '0 0 12px' } },
    h('summary', { text: '沒有 JavaScript 檔？用表單產生範本', style: { cursor: 'pointer', fontWeight: '700', margin: '0 0 10px' } }),
    h('div', { class: 'field-row' }, h('div', { class: 'field' }, h('label', { text: '分類名稱' }), fName), h('div', { class: 'field' }, h('label', { text: '積木類型' }), fKind)),
    h('div', { class: 'field' }, h('label', { text: '積木上的文字' }), fText, h('div', { class: 'hint', text: '用 [方括號] 標出要讓使用者填的空格，例如「把 [文字] 重複 [次數] 次」。' })),
    gen);
  const guide = h('details', { style: { margin: '0 0 12px' } },
    h('summary', { text: '寫法說明（相容 TurboWarp 擴充）', style: { cursor: 'pointer', fontWeight: '700', margin: '0 0 10px' } }),
    h('div', { class: 'callout' },
      h('div', null, '擴充是一個 class：'),
      h('div', null, '‧ ', h('code', { class: 'i', text: 'getInfo()' }), ' 回傳 id、name 和 blocks 清單，描述有哪些積木（opcode、blockType、text、arguments）。'),
      h('div', null, '‧ 每個 opcode 對應一個同名方法，積木被執行時會收到 ', h('code', { class: 'i', text: 'args' }), '，指令積木不用回傳，數值／條件積木要 return。'),
      h('div', null, '‧ 最後呼叫 ', h('code', { class: 'i', text: 'Scratch.extensions.register(new 你的類別())' }), '。'),
      h('div', null, '‧ 支援三種積木：COMMAND、REPORTER、BOOLEAN，參數可用 STRING、NUMBER、BOOLEAN、COLOR，也支援下拉選單（menus）。'),
      h('div', { style: { marginTop: '6px' } }, '匯出時，你的程式碼會完整放進腳本，在網頁上執行，所以可以直接用 ', h('code', { class: 'i', text: 'document' }), '、', h('code', { class: 'i', text: 'fetch' }), ' 等瀏覽器功能。編輯器本身不會執行它，只會讀取 getInfo() 裡的積木描述，所以 getInfo() 請直接寫出文字和數字。')));
  fillList();
  const m = openModal({
    title: '自訂積木', cls: 'wide',
    body: [
      h('p', { class: 'muted', text: '像 TurboWarp 一樣，匯入一段 JavaScript，裡面描述的積木就會出現在積木庫裡，讓你自由組合。匯出的腳本會包含這段程式，請只匯入你信任的程式碼。' }),
      h('div', { class: 'lb', style: { fontWeight: '700', margin: '0 0 6px' }, text: '已加入的自訂積木' }), listBox,
      h('div', { class: 'lb', style: { fontWeight: '700', margin: '0 0 6px' }, text: '匯入 JavaScript' }),
      h('div', { class: 'chips', style: { marginBottom: '8px' } }, fileBtn, h('span', { class: 'muted', style: { alignSelf: 'center', fontSize: '12.5px' }, text: '或載入範例：' }), samples),
      ta, h('div', { style: { height: '10px' } }), status, form, guide,
    ],
    footer: [h('button', { class: 'btn', text: '關閉', onclick: () => m.close() }), addBtn],
  });
  return m;
}

function bindUI() {
  $('#btnExport').onclick = () => toggleCodePane(true);
  $('#btnCodeClose').onclick = () => toggleCodePane(false);
  $('#btnCopy').onclick = doCopy;
  $('#btnDownload').onclick = doDownload;
  $('#btnInstall').onclick = openInstallHelp;
  $('#btnMeta').onclick = openMeta;
  $('#btnExamples').onclick = openExamples;
  $('#btnExt').onclick = () => openExtDialog();
  $('#btnProject').onclick = () => openProjectMenu($('#btnProject'));
  $('#optComments').onchange = refreshCode;
  $('#hintStart').onclick = () => addFromPalette('hat_start');
  $('#hintExamples').onclick = openExamples;
  $('#fileOpen').onchange = (e) => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) openProjectFile(f); };
  window.addEventListener('keydown', (e) => { if (e.key === 'Escape' && $('#codePane').classList.contains('open') && !_modals.length && !window.matchMedia('(min-width:1240px)').matches) toggleCodePane(false); });
}

/* =====================================================================
   範例專案
   ===================================================================== */
const chain = (...arr) => { arr = arr.flat().filter(Boolean); for (let i = 0; i < arr.length - 1; i++) arr[i].next = arr[i + 1]; return arr[0] || null; };
const B = (op, args, ...subs) => { const b = mkBlock(op, args); subs.forEach((s, i) => { b.subs[i] = s ? chain(s) : null; }); return b; };
const SC = (x, y, ...blocks) => ({ x, y, stack: chain(blocks) });

/* =====================================================================
   初始化
   ===================================================================== */
function init() {
  applyTheme(storeGet('tmblocks.theme') || 'auto', true);
  const z = parseFloat(storeGet('tmblocks.zoom'));
  if (z) view.zoom = clamp(z, 0.5, 1.6);
  else if (window.innerWidth < 520) view.zoom = 0.85;
  let restored = false;
  const saved = storeGet('tmblocks.project.v1');
  if (saved) { try { loadProject(JSON.parse(saved)); restored = true; } catch (e) { restored = false; } }
  renderCats();
  renderPalette();
  renderWorkspace();
  bindEditor();
  bindUI();
  resetHistory();
  refreshCode();
  getDownloadsCap();
  if (!restored && !storeGet('tmblocks.welcomed')) { storeSet('tmblocks.welcomed', '1'); setTimeout(openHelp, 250); }
}
init();
